<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>J.A.R.V.I.S.</title>

<style>

:root{
  --bg:#02070c;
  --bg2:#07111a;

  --text:#eaf8ff;
  --muted:#78919d;

  --cyan:#8de8ff;
  --cyan2:#5ec9ee;
  --cyan3:#b8f4ff;

  --danger:#ff8f8f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#02070c;

  color:var(--text);

  font-family:
    Inter,
    Arial,
    sans-serif;
}

body{
  display:flex;
}


/* =========================================================
   LOGIN
========================================================= */

.auth-gate{

  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:24px;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(65,182,222,.12),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      #08121c,
      #03090e
    );
}


.auth-card{

  width:min(
    360px,
    100%
  );

  padding:
    32px 28px;

  text-align:center;

  border-radius:14px;

  border:
    1px solid
    rgba(141,232,255,.18);

  background:
    rgba(5,15,23,.92);

  box-shadow:
    0 0 60px
      rgba(95,210,255,.05),
    inset 0 0 35px
      rgba(95,210,255,.025);
}


.auth-core{

  position:relative;

  width:76px;
  height:76px;

  margin:
    0 auto 24px;

  border-radius:50%;

  border:
    1px solid
    rgba(141,232,255,.60);

  box-shadow:
    0 0 22px
    rgba(141,232,255,.20);
}


.auth-core:before,
.auth-core:after{

  content:"";

  position:absolute;

  border-radius:50%;

  border:
    1px dashed
    rgba(141,232,255,.25);
}


.auth-core:before{
  inset:10px;
}


.auth-core:after{
  inset:25px;
}


.auth-title{

  margin-bottom:7px;

  font-size:16px;

  letter-spacing:.32em;

  padding-left:.32em;
}


.auth-subtitle{

  margin-bottom:25px;

  color:var(--muted);

  font-size:10px;

  letter-spacing:.18em;
}


.auth-card input{

  width:100%;

  margin-bottom:11px;

  padding:
    12px 13px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.18);

  outline:none;

  background:
    rgba(3,10,16,.92);

  color:var(--text);

  font-size:14px;
}


.auth-card input:focus{

  border-color:
    rgba(141,232,255,.60);

  box-shadow:
    0 0 12px
    rgba(141,232,255,.08);
}


.auth-card button{

  width:100%;

  padding:12px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.42);

  background:
    rgba(10,32,45,.72);

  color:var(--text);

  font-size:11px;

  letter-spacing:.16em;

  cursor:pointer;
}


.auth-error{

  min-height:18px;

  margin-top:13px;

  color:var(--danger);

  font-size:10px;
}


/* =========================================================
   PANEL
========================================================= */

.panel{

  display:none;

  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  perspective:1000px;

  background:
    radial-gradient(
      ellipse at 50% 44%,
      rgba(58,154,194,.075),
      transparent 27%
    ),
    linear-gradient(
      180deg,
      #07111a,
      #020609
    );

  transition:
    background .35s ease;
}


/* =========================================================
   BACKGROUND DEPTH
========================================================= */

.scene-glow{

  position:absolute;

  left:50%;
  top:47%;

  width:420px;
  height:420px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(141,232,255,.05),
      rgba(141,232,255,.017) 38%,
      transparent 68%
    );

  filter:
    blur(44px);

  opacity:.15;

  pointer-events:none;

  transition:
    opacity .3s,
    transform .3s;
}


.floor-shadow{

  position:absolute;

  left:50%;
  top:56%;

  width:250px;
  height:70px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.72),
      rgba(0,0,0,.25) 43%,
      transparent 72%
    );

  filter:
    blur(19px);

  opacity:.80;

  pointer-events:none;
}


/* =========================================================
   TOP BAR
========================================================= */

.top{

  position:relative;

  z-index:20;

  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:
    15px 18px 4px;

  color:var(--muted);

  font-size:12px;

  letter-spacing:.18em;
}


.online{

  display:flex;

  align-items:center;

  gap:7px;
}


.dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--cyan);

  box-shadow:
    0 0 10px
    var(--cyan);
}


.logout{

  margin-left:10px;

  border:0;

  background:none;

  color:var(--muted);

  font-size:8px;

  letter-spacing:.12em;

  cursor:pointer;

  opacity:.60;
}


.logout:hover{

  opacity:1;

  color:var(--text);
}


/* =========================================================
   CENTRE
========================================================= */

.centre{

  position:absolute;

  left:50%;
  top:48%;

  transform:
    translate(-50%,-50%);

  width:min(
    96%,
    620px
  );

  text-align:center;
}


/* =========================================================
   3D STAGE
========================================================= */

.core-stage{

  position:relative;

  width:100%;

  height:310px;

  display:flex;

  justify-content:center;
  align-items:center;

  transform-style:
    preserve-3d;
}


/* =========================================================
   CORE
========================================================= */

.core{

  position:relative;

  width:230px;
  height:230px;

  z-index:10;

  display:flex;

  justify-content:center;
  align-items:center;

  transform-style:
    preserve-3d;

  transform:
    rotateX(5deg)
    rotateY(-4deg);

  transition:
    transform .18s ease,
    filter .18s ease;
}


/* =========================================================
   BACK SPHERE
========================================================= */

.sphere{

  position:absolute;

  inset:35px;

  border-radius:50%;

  transform:
    translateZ(-12px);

  background:

    radial-gradient(
      circle at 36% 28%,
      rgba(220,250,255,.14),
      rgba(141,232,255,.04) 22%,
      rgba(26,68,88,.035) 48%,
      rgba(0,0,0,.26) 72%,
      transparent 76%
    );

  box-shadow:
    inset -16px -18px 28px
      rgba(0,0,0,.34),
    inset 10px 9px 18px
      rgba(141,232,255,.035);

  pointer-events:none;
}


/* =========================================================
   ORBITAL RINGS
========================================================= */

.orbit{

  position:absolute;

  left:50%;
  top:50%;

  border-radius:50%;

  pointer-events:none;

  transform-style:
    preserve-3d;
}


.orbit-a{

  width:232px;
  height:232px;

  border:
    1px solid
    rgba(141,232,255,.22);

  animation:
    orbitA
    21s linear infinite;
}


.orbit-b{

  width:214px;
  height:214px;

  border:
    1px dashed
    rgba(141,232,255,.17);

  animation:
    orbitB
    26s linear infinite;
}


.orbit-c{

  width:198px;
  height:198px;

  border:
    1px solid
    rgba(141,232,255,.10);

  animation:
    orbitC
    31s linear infinite;
}


/* =========================================================
   HOLOGRAPHIC FLOOR RINGS
========================================================= */

.floor-ring,
.floor-ring2,
.floor-ring3{

  position:absolute;

  left:50%;

  border-radius:50%;

  pointer-events:none;

  transform-style:
    preserve-3d;
}


.floor-ring{

  width:330px;
  height:105px;

  bottom:-4px;

  transform:
    translateX(-50%)
    perspective(700px)
    rotateX(77deg);

  border:
    1px solid
    rgba(141,232,255,.09);

  box-shadow:
    0 0 16px
    rgba(141,232,255,.035);

  opacity:.40;
}


.floor-ring2{

  width:250px;
  height:76px;

  bottom:10px;

  transform:
    translateX(-50%)
    perspective(700px)
    rotateX(77deg);

  border:
    1px dashed
    rgba(141,232,255,.085);

  opacity:.30;
}


.floor-ring3{

  width:155px;
  height:43px;

  bottom:27px;

  transform:
    translateX(-50%)
    perspective(700px)
    rotateX(77deg);

  border:
    1px solid
    rgba(141,232,255,.07);

  opacity:.24;
}


/* =========================================================
   MAIN HUD RINGS
========================================================= */

.main-ring,
.inner-ring,
.scan-ring,
.arc-ring,
.thinking-ring{

  position:absolute;

  border-radius:50%;

  pointer-events:none;
}


.main-ring{

  inset:31px;

  transform:
    translateZ(15px);

  border:
    1px solid
    rgba(141,232,255,.33);

  animation:
    rotateClockwise
    19s linear infinite;
}


.main-ring:before,
.main-ring:after{

  content:"";

  position:absolute;

  border-radius:50%;

  background:
    var(--cyan);

  box-shadow:
    0 0 8px
    rgba(141,232,255,.75);
}


.main-ring:before{

  width:5px;
  height:5px;

  left:16px;
  top:28px;
}


.main-ring:after{

  width:3px;
  height:3px;

  right:19px;
  bottom:31px;
}


.inner-ring{

  inset:50px;

  transform:
    translateZ(28px);

  border:
    1px dashed
    rgba(141,232,255,.22);

  opacity:.50;

  animation:
    rotateCounter
    25s linear infinite;
}


.scan-ring{

  inset:17px;

  border:
    1px solid
    transparent;

  border-top-color:
    rgba(141,232,255,.18);

  border-right-color:
    rgba(141,232,255,.035);

  opacity:.20;

  animation:
    rotateClockwise
    32s linear infinite;
}


.arc-ring{

  inset:70px;

  transform:
    translateZ(40px);

  border:
    2px solid
    transparent;

  border-top-color:
    rgba(141,232,255,.27);

  border-left-color:
    rgba(141,232,255,.075);

  opacity:.55;

  animation:
    rotateCounter
    10s linear infinite;
}


/* =========================================================
   THINKING RING
========================================================= */

.thinking-ring{

  inset:2px;

  opacity:0;

  background:

    repeating-conic-gradient(
      from 0deg,
      rgba(141,232,255,.42) 0deg 2deg,
      transparent 2deg 13deg
    );

  mask:

    radial-gradient(
      circle,
      transparent 65%,
      #000 66% 68%,
      transparent 69%
    );

  -webkit-mask:

    radial-gradient(
      circle,
      transparent 65%,
      #000 66% 68%,
      transparent 69%
    );

  transition:
    opacity .20s;
}


/* =========================================================
   RADIAL AUDIO CANVAS
========================================================= */

.audio-spectrum{

  position:absolute;

  left:50%;
  top:50%;

  width:310px;
  height:310px;

  transform:
    translate(-50%,-50%)
    translateZ(50px);

  pointer-events:none;

  opacity:0;

  z-index:16;

  transition:
    opacity .15s ease;
}


/* =========================================================
   SUBTLE AUDIO RINGS
========================================================= */

.voice-wave{

  position:absolute;

  border-radius:50%;

  pointer-events:none;

  transition:
    transform .07s linear,
    opacity .07s linear,
    box-shadow .07s linear;
}


.wave1{

  inset:25px;

  border:
    1px solid
    rgba(141,232,255,.09);

  opacity:.035;
}


.wave2{

  inset:7px;

  border:
    1px solid
    rgba(141,232,255,.055);

  opacity:.02;
}


/* =========================================================
   CORE LENS
========================================================= */

.core-halo{

  position:absolute;

  inset:66px;

  border-radius:50%;

  transform:
    translateZ(44px);

  border:
    1px solid
    rgba(141,232,255,.20);

  box-shadow:
    0 0 11px
      rgba(141,232,255,.075),
    inset 0 0 14px
      rgba(141,232,255,.055);

  transition:
    transform .08s,
    box-shadow .08s;
}


.inner-lens{

  position:absolute;

  inset:80px;

  border-radius:50%;

  transform:
    translateZ(52px);

  background:
    radial-gradient(
      circle at 35% 27%,
      rgba(220,250,255,.18),
      rgba(141,232,255,.075) 27%,
      rgba(41,101,130,.035) 56%,
      transparent 74%
    );

  box-shadow:
    inset -7px -8px 12px
      rgba(0,0,0,.26),
    inset 4px 4px 9px
      rgba(255,255,255,.035);
}


.core-dot{

  position:relative;

  z-index:30;

  width:33px;
  height:33px;

  border-radius:50%;

  transform:
    translateZ(70px);

  border:
    1px solid
    rgba(141,232,255,.95);

  background:

    radial-gradient(
      circle at 34% 27%,
      rgba(235,253,255,.25),
      rgba(141,232,255,.10) 32%,
      rgba(141,232,255,.018) 69%
    );

  box-shadow:
    0 0 18px
      rgba(141,232,255,.40),
    inset -5px -6px 9px
      rgba(0,0,0,.22),
    inset 4px 3px 8px
      rgba(255,255,255,.07);

  transition:
    transform .07s,
    box-shadow .07s;
}


/* =========================================================
   STANDBY
========================================================= */

.panel.standby .scene-glow{

  opacity:.12;
}


.panel.standby .orbit-a{

  opacity:.25;
}


.panel.standby .orbit-b{

  opacity:.18;
}


.panel.standby .orbit-c{

  opacity:.12;
}


.panel.standby .core-dot{

  animation:
    standbyBreath
    4.2s ease-in-out infinite;
}


/* =========================================================
   LISTENING
========================================================= */

.panel.listening .scene-glow{

  opacity:.20;

  transform:
    translate(-50%,-50%)
    scale(1.02);
}


.panel.listening .orbit-a{

  opacity:.43;
}


.panel.listening .orbit-b{

  opacity:.31;
}


.panel.listening .orbit-c{

  opacity:.20;
}


.panel.listening .main-ring{

  opacity:.70;

  animation-duration:
    13s;
}


.panel.listening .inner-ring{

  opacity:.46;
}


.panel.listening .core-halo{

  animation:
    listeningBreath
    1.5s ease-in-out infinite;
}


/* =========================================================
   ANALYSING
========================================================= */

.panel.analysing{

  background:
    radial-gradient(
      ellipse at 50% 44%,
      rgba(53,133,167,.065),
      transparent 25%
    ),
    linear-gradient(
      180deg,
      #040b10,
      #010406
    );
}


.panel.analysing .scene-glow{

  opacity:.12;
}


.panel.analysing .thinking-ring{

  opacity:.58;

  animation:
    rotateClockwise
    2s linear infinite;
}


.panel.analysing .main-ring{

  opacity:.62;

  animation-duration:
    2.1s;
}


.panel.analysing .inner-ring{

  opacity:.70;

  animation-duration:
    3s;
}


.panel.analysing .scan-ring{

  opacity:.74;

  animation-duration:
    1.25s;
}


.panel.analysing .orbit-a{

  opacity:.48;

  animation-duration:
    5s;
}


.panel.analysing .orbit-b{

  opacity:.35;

  animation-duration:
    6.5s;
}


.panel.analysing .orbit-c{

  opacity:.26;

  animation-duration:
    8s;
}


.panel.analysing .core{

  transform:
    rotateX(10deg)
    rotateY(7deg)
    scale(.985);
}


.panel.analysing .core-dot{

  animation:
    thinkingPulse
    .8s ease-in-out infinite;
}


/* =========================================================
   SPEAKING
========================================================= */

.panel.speaking .scene-glow{

  opacity:.22;

  transform:
    translate(-50%,-50%)
    scale(1.04);
}


.panel.speaking .audio-spectrum{

  opacity:1;
}


.panel.speaking .orbit-a{

  opacity:.40;
}


.panel.speaking .orbit-b{

  opacity:.30;
}


.panel.speaking .orbit-c{

  opacity:.20;
}


.panel.speaking .main-ring{

  opacity:.70;

  animation-duration:
    10s;
}


.panel.speaking .inner-ring{

  opacity:.48;

  animation-duration:
    13s;
}


.panel.speaking .arc-ring{

  opacity:.68;
}


.panel.speaking .core-dot{

  box-shadow:
    0 0 27px
      rgba(141,232,255,.68),
    inset -5px -6px 9px
      rgba(0,0,0,.20),
    inset 4px 3px 9px
      rgba(255,255,255,.08);
}


/* =========================================================
   TEXT
========================================================= */

h1{

  margin:
    7px 0 7px;

  padding-left:.32em;

  font-size:15px;

  letter-spacing:.32em;

  font-weight:600;
}


.status{

  min-height:16px;

  color:var(--cyan);

  font-size:11px;

  letter-spacing:.20em;
}


.message{

  min-height:16px;

  margin-top:8px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   VOICE BUTTON
========================================================= */

.voice-button{

  margin-top:18px;

  padding:
    9px 18px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.26);

  background:
    rgba(8,25,36,.60);

  color:var(--cyan);

  font-size:9px;

  letter-spacing:.18em;

  cursor:pointer;

  transition:.2s;
}


.voice-button.active{

  border-color:
    rgba(141,232,255,.62);

  box-shadow:
    0 0 14px
    rgba(141,232,255,.10);
}


.voice-button:disabled{

  opacity:.40;
}


/* =========================================================
   METRICS
========================================================= */

.bottom{

  position:absolute;

  left:14px;
  right:14px;
  bottom:12px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}


.metric{

  padding-top:7px;

  text-align:center;

  border-top:
    1px solid
    rgba(141,232,255,.13);
}


.metric b{

  display:block;

  font-size:12px;

  font-weight:500;
}


.metric span{

  color:var(--muted);

  font-size:8px;

  letter-spacing:.13em;
}


.stale{

  opacity:.50;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes rotateClockwise{

  to{
    transform:
      rotate(360deg);
  }
}


@keyframes rotateCounter{

  to{
    transform:
      rotate(-360deg);
  }
}


@keyframes orbitA{

  from{
    transform:
      translate(-50%,-50%)
      rotateX(68deg)
      rotateZ(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotateX(68deg)
      rotateZ(360deg);
  }
}


@keyframes orbitB{

  from{
    transform:
      translate(-50%,-50%)
      rotateY(70deg)
      rotateZ(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotateY(70deg)
      rotateZ(-360deg);
  }
}


@keyframes orbitC{

  from{
    transform:
      translate(-50%,-50%)
      rotateX(42deg)
      rotateY(50deg)
      rotateZ(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotateX(42deg)
      rotateY(50deg)
      rotateZ(360deg);
  }
}


@keyframes standbyBreath{

  50%{

    transform:
      translateZ(70px)
      scale(1.035);

    opacity:.90;
  }
}


@keyframes listeningBreath{

  50%{

    transform:
      translateZ(44px)
      scale(1.10);

    box-shadow:
      0 0 20px
      rgba(141,232,255,.15);
  }
}


@keyframes thinkingPulse{

  50%{

    transform:
      translateZ(70px)
      scale(.90);

    opacity:.64;
  }
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(
  max-height:520px
){

  .core-stage{

    height:255px;
  }


  .core{

    width:195px;
    height:195px;
  }


  .audio-spectrum{

    width:265px;
    height:265px;
  }
}

</style>

</head>


<body>


<!-- ======================================================
     LOGIN
====================================================== -->

<div
  class="auth-gate"
  id="authGate"
>

  <form
    class="auth-card"
    id="loginForm"
  >

    <div class="auth-core"></div>

    <div class="auth-title">
      J.A.R.V.I.S.
    </div>

    <div class="auth-subtitle">
      AUTHORISED ACCESS ONLY
    </div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="username"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button
      id="loginButton"
      type="submit"
    >
      AUTHENTICATE
    </button>

    <div
      class="auth-error"
      id="authError"
    ></div>

  </form>

</div>



<!-- ======================================================
     MAIN
====================================================== -->

<div
  class="panel standby"
  id="panel"
>

  <div
    class="scene-glow"
  ></div>

  <div
    class="floor-shadow"
  ></div>


  <div class="top">

    <div>
      J.A.R.V.I.S.
    </div>

    <div class="online">

      <span class="dot"></span>

      <span id="linkState">
        ONLINE
      </span>

      <button
        class="logout"
        id="logoutButton"
      >
        LOG OUT

/* =========================================================
   RADIAL EQUALIZER
========================================================= */

function drawRadialSpectrum(
  frequencies,
  level
){

  const canvas =
    el(
      "audioSpectrum"
    );


  const ctx =
    canvas
      .getContext(
        "2d"
      );


  const w =
    canvas.width;


  const h =
    canvas.height;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  if(
    voicePhase !==
    "speaking"
  ){

    return;
  }


  const cx =
    w / 2;


  const cy =
    h / 2;


  /*
    More bars than before.

    Enough to look detailed,
    not enough to become a fuzzy hedgehog.
  */

  const bars =
    72;


  const baseRadius =
    205;


  /*
    Speech frequencies are mostly in the
    lower part of the FFT.

    Sampling only that region gives the
    bars much nicer movement.
  */

  const usefulBins =
    Math.min(
      105,
      frequencies.length
    );


  for(
    let i = 0;
    i < bars;
    i++
  ){

    const ratio =
      i /
      bars;


    const angle =
      ratio *
      Math.PI *
      2
      -
      Math.PI /
      2;


    /*
      Mirror the frequencies.

      This gives the radial display
      a more designed/symmetrical appearance
      while still reacting to actual speech.
    */

    const mirrorRatio =
      ratio <= .5
        ?
        ratio * 2
        :
        (
          1 -
          ratio
        ) * 2;


    const freqIndex =
      Math.floor(
        mirrorRatio *
        (
          usefulBins -
          1
        )
      );


    const frequencyStrength =
      frequencies[
        freqIndex
      ] /
      255;


    /*
      Local audio signal + overall voice level.
    */

    let strength =
      frequencyStrength *
      .82
      +
      level *
      .28;


    strength =
      Math.min(
        1,
        strength
      );


    /*
      Fake perspective.

      Bottom bars are subtly larger and
      brighter than top bars.

      That makes the equalizer feel like
      it occupies the same 3D space
      as the holographic rings.
    */

    const vertical =
      (
        Math.sin(
          angle
        ) +
        1
      ) /
      2;


    const depth =
      .66 +
      vertical *
      .34;


    const length =
      (
        7 +
        strength *
        48
      ) *
      depth;


    const radius =
      baseRadius +
      vertical *
      5;


    const x1 =
      cx +
      Math.cos(
        angle
      ) *
      radius;


    const y1 =
      cy +
      Math.sin(
        angle
      ) *
      radius;


    const x2 =
      cx +
      Math.cos(
        angle
      ) *
      (
        radius +
        length
      );


    const y2 =
      cy +
      Math.sin(
        angle
      ) *
      (
        radius +
        length
      );


    const alpha =
      (
        .18 +
        strength *
        .66
      ) *
      depth;


    /*
      Outer glow pass
    */

    ctx.beginPath();


    ctx.moveTo(
      x1,
      y1
    );


    ctx.lineTo(
      x2,
      y2
    );


    ctx.strokeStyle =
      `rgba(
        94,
        201,
        238,
        ${
          alpha *
          .28
        }
      )`;


    ctx.lineWidth =
      5.5;


    ctx.lineCap =
      "round";


    ctx.shadowColor =
      "rgba(141,232,255,.42)";


    ctx.shadowBlur =
      13;


    ctx.stroke();



    /*
      Crisp bright line
    */

    ctx.beginPath();


    ctx.moveTo(
      x1,
      y1
    );


    ctx.lineTo(
      x2,
      y2
    );


    ctx.strokeStyle =
      `rgba(
        160,
        240,
        255,
        ${alpha}
      )`;


    ctx.lineWidth =
      1.8 +
      strength *
      .7;


    ctx.lineCap =
      "round";


    ctx.shadowColor =
      "rgba(141,232,255,.62)";


    ctx.shadowBlur =
      strength *
      7;


    ctx.stroke();



    /*
      Tiny bright dot at the outer tip
      on stronger audio peaks.
    */

    if(
      strength >
      .42
    ){

      ctx.beginPath();


      ctx.arc(
        x2,
        y2,
        .8 +
        strength *
        .8,
        0,
        Math.PI *
        2
      );


      ctx.fillStyle =
        `rgba(
          190,
          246,
          255,
          ${
            alpha *
            .85
          }
        )`;


      ctx.shadowBlur =
        7;


      ctx.fill();
    }
  }


  ctx.shadowBlur =
    0;
}



/* =========================================================
   AUDIO LOOP
========================================================= */

function animateAudio(){

  if(
    !remoteAnalyser ||
    !audioTimeData ||
    !audioFreqData
  ){

    return;
  }


  remoteAnalyser
    .getByteTimeDomainData(
      audioTimeData
    );


  remoteAnalyser
    .getByteFrequencyData(
      audioFreqData
    );


  /*
    Calculate actual output volume.
  */

  let sum =
    0;


  for(
    let i = 0;
    i < audioTimeData.length;
    i++
  ){

    const n =
      (
        audioTimeData[i] -
        128
      ) /
      128;


    sum +=
      n *
      n;
  }


  const rms =
    Math.sqrt(
      sum /
      audioTimeData.length
    );


  let level =
    (
      rms -
      .004
    ) *
    14;


  level =
    Math.max(
      0,
      Math.min(
        1,
        level
      )
    );


  smoothLevel =
    smoothLevel *
      .67
    +
    level *
      .33;


  const v =
    smoothLevel;



  /* =======================================================
     AUDIO-DRIVEN SPEAKING STATE
  ======================================================= */

  /*
    This fixes the important problem:

    the visual state is now based partly
    on ACTUAL audible JARVIS audio.

    So a new sentence doesn't randomly
    turn the equalizer back into idle rings.
  */

  if(
    v >
    .035

      performance.now();


    if(
      voicePhase !==
      "speaking"

  } else {

    const silenceTime =
      performance.now() -
      lastAudibleTime;


    /*
      Keep SPEAKING alive over natural
      pauses between words/sentences.
    */

    if(
      voicePhase ===
      "speaking"
      &&
      silenceTime >
      520
    ){

      if(
        modelResponding

        setVoicePhase(
          "analysing"
        );

        );
      }
    }

  /* =======================================================
     VERY SUBTLE RING RESPONSE
  ======================================================= */

  animateWave(
    "wave1",
    1 +
      v *
      .12,
    .035 +
      v *
      .09
  );


  animateWave(
    "wave2",
    1 +
      v *
      .18,
    .02 +
      v *
      .055
  );



  /* =======================================================
     CORE RESPONSE
  ======================================================= */

  el(
    "coreDot"
  )
  .style.transform =
    `
      translateZ(70px)
      scale(${
        1 +
        v *
        .12
      })
    `;


  el(
    "coreHalo"
  )
  .style.transform =
    `
      translateZ(44px)
      scale(${
        1 +
        v *
        .09
      })
    `;



  /*
    Tiny floating motion.

    Enough to give depth.
    Not enough to make JARVIS seasick.
  */

  if(
    voicePhase ===
    "speaking"
  ){

    el(
      "core"
    )
    .style.transform =
      `
        rotateX(${
          4 +
          v *
          2
        }deg)

        rotateY(${
          -4 -
          v *
          2
        }deg)

        translateY(${
          -v *
          2
        }px)

        scale(${
          1.01 +
          v *
          .015
        })
      `;
  }



  drawRadialSpectrum(
    audioFreqData,
    v
  );


  animationFrame =
    requestAnimationFrame(
      animateAudio
    );
}

/* =========================================================
   REALTIME EVENTS
========================================================= */

function handleRealtimeEvent(
  event
){

  const type =
    event?.type ||
    "";


  if(
    type ===
    "input_audio_buffer.speech_started"
  ){

    modelResponding =
      false;


    setVoicePhase(
      "listening"
    );


    return;
  }


  if(
    type ===
    "input_audio_buffer.speech_stopped"
  ){

    setVoicePhase(
      "analysing"
    );


    return;
  }


  if(
    type ===
    "response.created"
  ){

    modelResponding =
      true;


    setVoicePhase(
      "analysing"
    );


    return;
  }


  /*
    Realtime tells us audio is being generated.

    The actual audio analyser then keeps
    SPEAKING active until the sound itself
    has genuinely stopped.
  */

  if(
    type ===
    "response.output_audio.delta"
    ||
    (
      type.includes(
        "output_audio"
      )
      &&
      type.includes(
        "delta"
      )
    )
  ){

    setVoicePhase(
      "speaking"
    );


    return;
  }


  if(
    type ===
    "response.done"
    ||
    type ===
    "response.completed"
  ){

    modelResponding =
      false;


    /*
      Do NOT immediately force LISTENING here.

      There may still be buffered audio
      playing through the speaker.

      The analyser decides when speech
      has actually finished.
    */

    return;
  }


  if(
    type ===
    "error"
  ){

    modelResponding =
      false;


    console.error(
      event
    );


    el(
      "status"
    )
    .textContent =
      "VOICE LINK ERROR";


    el(
      "message"
    )
    .textContent =
      event?.error?.message
      ||
      "Realtime channel reported an error.";
  }
}



/* =========================================================
   START VOICE
========================================================= */

async function startVoice(){

  if(
    peerConnection
  ){

    return;
  }


  const button =
    el(
      "voiceButton"
    );


  button.disabled =
    true;


  button.textContent =
    "CONNECTING...";


  setVoicePhase(
    "connecting"
  );


  try{


    if(
      !navigator
        .mediaDevices
        ?.getUserMedia
    ){

      throw new Error(
        "Microphone access is unavailable in this browser."
      );
    }



    /* -----------------------------------------------------
       TEMPORARY REALTIME KEY
    ----------------------------------------------------- */

    const {
      data:tokenData,
      error:tokenError
    } =
      await supabase
        .functions
        .invoke(
          "jarvis-realtime",
          {
            body:{}
          }
        );


    if(
      tokenError
    ){

      throw tokenError;
    }


    const key =
      tokenData?.value;


    if(
      !key
    ){

      throw new Error(
        "No ephemeral realtime key returned."
      );
    }



    /* -----------------------------------------------------
       WEBRTC
    ----------------------------------------------------- */

    const pc =
      new RTCPeerConnection();


    peerConnection =
      pc;



    /* -----------------------------------------------------
       SPEAKER OUTPUT
    ----------------------------------------------------- */

    const audio =
      document.createElement(
        "audio"
      );


    audio.autoplay =
      true;


    audio.playsInline =
      true;


    audio.style.display =
      "none";


    document.body
      .appendChild(
        audio
      );


    remoteAudio =
      audio;


    pc.ontrack =
      event => {

        const stream =
          event.streams[0];


        audio.srcObject =
          stream;


        setupAudioVisuals(
          stream
        );


        audio.play()
          .catch(
            error =>
              console.warn(
                "Audio playback:",
                error
              )
          );
      };



    /* -----------------------------------------------------
       MICROPHONE
    ----------------------------------------------------- */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:{

            echoCancellation:
              true,

            noiseSuppression:
              true,

            autoGainControl:
              true

          }

        });


    localStream =
      stream;


    const track =
      stream
        .getAudioTracks()[0];


    if(
      !track
    ){

      throw new Error(
        "No microphone audio track available."
      );
    }


    pc.addTrack(
      track,
      stream
    );



    /* -----------------------------------------------------
       REALTIME EVENTS
    ----------------------------------------------------- */

    const dc =
      pc.createDataChannel(
        "oai-events"
      );


    dataChannel =
      dc;


    dc.addEventListener(
      "open",
      () => {

        button.disabled =
          false;


        button.textContent =
          "DISCONNECT VOICE";


        button
          .classList
          .add(
            "active"
          );


        setVoicePhase(
          "listening"
        );
      }
    );


    dc.addEventListener(
      "message",
      event => {

        try{

          const message =
            JSON.parse(
              event.data
            );


          handleRealtimeEvent(
            message
          );

        } catch(error){

          console.warn(
            error
          );
        }
      }
    );



    /* -----------------------------------------------------
       SDP
    ----------------------------------------------------- */

    const offer =
      await pc
        .createOffer();


    await pc
      .setLocalDescription(
        offer
      );


    const response =
      await fetch(
        "https://api.openai.com/v1/realtime/calls",
        {

          method:
            "POST",

          body:
            offer.sdp,

          headers:{

            "Authorization":
              `Bearer ${key}`,

            "Content-Type":
              "application/sdp"

          }

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        await response.text()
      );
    }


    await pc
      .setRemoteDescription({

        type:
          "answer",

        sdp:
          await response
            .text()

      });



    pc.addEventListener(
      "connectionstatechange",
      () => {

        if(
          peerConnection !==
          pc
        ){

          return;
        }


        if(
          pc.connectionState ===
          "failed"
          ||
          pc.connectionState ===
          "closed"
        ){

          stopVoice();
        }
      }
    );


  } catch(error){

    console.error(
      error
    );


    stopVoice(
      false
    );


    el(
      "status"
    )
    .textContent =
      "VOICE LINK FAILED";


    if(
      error?.name ===
      "NotAllowedError"
    ){

      el(
        "message"
      )
      .textContent =
        "Microphone permission was denied.";

    } else {

      el(
        "message"
      )
      .textContent =
        error?.message
        ||
        "Realtime connection failed.";
    }


    button.disabled =
      false;


    button.textContent =
      "RETRY VOICE";
  }
}



/* =========================================================
   STOP
========================================================= */

function stopVoice(
  updateUi = true
){

  const pc =
    peerConnection;


  const dc =
    dataChannel;


  peerConnection =
    null;


  dataChannel =
    null;


  modelResponding =
    false;


  resetAudioVisuals();



  if(
    localStream
  ){

    for(
      const track
      of localStream
        .getTracks()
    ){

      track.stop();
    }


    localStream =
      null;
  }



  if(
    remoteAudio
  ){

    try{

      remoteAudio.pause();


      remoteAudio.srcObject =
        null;


      remoteAudio.remove();

    } catch{}


    remoteAudio =
      null;
  }



  try{

    dc?.close();

  } catch{}



  try{

    pc?.close();

  } catch{}



  voicePhase =
    "disconnected";


  const button =
    el(
      "voiceButton"
    );


  button.disabled =
    false;


  button.textContent =
    "ACTIVATE VOICE";


  button
    .classList
    .remove(
      "active"
    );


  setVisualState(
    "standby"
  );


  if(
    updateUi
  ){

    restoreBaseStatus();
  }
}



/* =========================================================
   BUTTON
========================================================= */

el(
  "voiceButton"
)
.addEventListener(
  "click",
  async () => {

    if(
      peerConnection
    ){

      stopVoice();

    } else {

      await startVoice();
    }
  }
);



/* =========================================================
   LOGIN
========================================================= */

el(
  "loginForm"
)
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      el(
        "email"
      )
      .value
      .trim();


    const password =
      el(
        "password"
      )
      .value;


    const button =
      el(
        "loginButton"
      );


    el(
      "authError"
    )
    .textContent =
      "";


    button.disabled =
      true;


    button.textContent =
      "AUTHENTICATING...";


    const {
      error
    } =
      await supabase
        .auth
        .signInWithPassword({
          email,
          password
        });


    button.disabled =
      false;


    button.textContent =
      "AUTHENTICATE";


    if(
      error
    ){

      el(
        "authError"
      )
      .textContent =
        "ACCESS DENIED";


      return;
    }


    el(
      "password"
    )
    .value =
      "";


    showDashboard();
  }
);



/* =========================================================
   LOG OUT
========================================================= */

el(
  "logoutButton"
)
.addEventListener(
  "click",
  async () => {

    stopVoice(
      false
    );


    await supabase
      .auth
      .signOut({

        scope:
          "local"

      });


    showLogin();
  }
);



/* =========================================================
   INITIAL SESSION
========================================================= */

const {

  data:{
    session
  }

} =
  await supabase
    .auth
    .getSession();


if(
  session
){

  showDashboard();

} else {

  showLogin();
}



supabase
  .auth
  .onAuthStateChange(
    (
      event,
      session
    ) => {

      if(
        event ===
        "SIGNED_OUT"
      ){

        showLogin();
      }


      if(
        event ===
        "SIGNED_IN"
        &&
        session
      ){

        showDashboard();
      }
    }
  );

</script>
