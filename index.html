<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title>

<style>
:root{
  --bg:#040a10;
  --bg2:#07111a;
  --text:#eaf8ff;
  --muted:#78919d;
  --glow:#8de8ff;
  --glow2:#5ec9ee;
  --danger:#ff8f8f;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

body{
  display:flex;
}

/* =========================================================
   LOGIN
========================================================= */

.auth-gate{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 40%, rgba(65,182,222,.12), transparent 34%),
    linear-gradient(180deg, #08121c, #03090e);
}

.auth-card{
  width:min(360px,100%);
  padding:32px 28px;
  text-align:center;
  border-radius:14px;
  border:1px solid rgba(141,232,255,.18);
  background:rgba(5,15,23,.92);
  box-shadow:
    0 0 60px rgba(95,210,255,.05),
    inset 0 0 35px rgba(95,210,255,.025);
}

.auth-core{
  width:76px;
  height:76px;
  margin:0 auto 24px;
  position:relative;
  border-radius:50%;
  border:1px solid rgba(141,232,255,.60);
  box-shadow:0 0 22px rgba(141,232,255,.20);
}

.auth-core:before,
.auth-core:after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px dashed rgba(141,232,255,.25);
}

.auth-core:before{ inset:10px; }
.auth-core:after{ inset:25px; }

.auth-title{
  margin-bottom:7px;
  font-size:16px;
  letter-spacing:.32em;
  padding-left:.32em;
}

.auth-subtitle{
  margin-bottom:25px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.18em;
}

.auth-card input{
  width:100%;
  margin-bottom:11px;
  padding:12px 13px;
  border-radius:8px;
  border:1px solid rgba(141,232,255,.18);
  outline:none;
  background:rgba(3,10,16,.92);
  color:var(--text);
  font-size:14px;
}

.auth-card input:focus{
  border-color:rgba(141,232,255,.60);
  box-shadow:0 0 12px rgba(141,232,255,.08);
}

.auth-card button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid rgba(141,232,255,.42);
  background:rgba(10,32,45,.72);
  color:var(--text);
  font-size:11px;
  letter-spacing:.16em;
  cursor:pointer;
}

.auth-error{
  min-height:18px;
  margin-top:13px;
  color:var(--danger);
  font-size:10px;
}

/* =========================================================
   MAIN PANEL
========================================================= */

.panel{
  display:none;
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 44%, rgba(72,176,211,.08), transparent 26%),
    linear-gradient(180deg, #07111a, #03080d);
  transition:background .35s ease;
}

.scene-glow{
  position:absolute;
  left:50%;
  top:48%;
  width:420px;
  height:420px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle, rgba(141,232,255,.06), rgba(141,232,255,.02) 38%, transparent 68%);
  filter:blur(36px);
  opacity:.22;
  pointer-events:none;
  transition:opacity .25s, transform .25s;
}

/* =========================================================
   TOP BAR
========================================================= */

.top{
  position:relative;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 18px 4px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.18em;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--glow);
  box-shadow:0 0 10px var(--glow);
}

.logout{
  margin-left:10px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:8px;
  letter-spacing:.12em;
  cursor:pointer;
  opacity:.60;
}

.logout:hover{
  opacity:1;
  color:var(--text);
}

/* =========================================================
   CENTRE
========================================================= */

.centre{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  width:min(96%,680px);
  text-align:center;
}

/* =========================================================
   CORE + 3D LAYERS
========================================================= */

.core-wrap{
  position:relative;
  width:100%;
  height:290px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
}

.waveform-line{
  position:absolute;
  left:50%;
  top:50%;
  width:min(92vw,620px);
  height:120px;
  transform:translate(-50%,-50%);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}

.core{
  position:relative;
  width:220px;
  height:220px;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s linear, filter .2s linear;
}

.core-shadow{
  position:absolute;
  inset:-12px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,0,0,.22), transparent 68%);
  filter:blur(14px);
  opacity:.8;
  pointer-events:none;
}

.core-ambient{
  position:absolute;
  inset:-52px;
  border-radius:50%;
  background:
    radial-gradient(circle, rgba(141,232,255,.08), rgba(75,182,220,.02) 42%, transparent 70%);
  filter:blur(24px);
  opacity:.26;
  transition:opacity .18s, transform .18s;
  pointer-events:none;
}

.holo-disc,
.holo-disc2{
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  pointer-events:none;
  transform-style:preserve-3d;
}

.holo-disc{
  width:276px;
  height:86px;
  transform:translate(-50%,30px) perspective(700px) rotateX(76deg);
  border:1px solid rgba(141,232,255,.10);
  box-shadow:
    0 0 18px rgba(141,232,255,.08),
    inset 0 0 18px rgba(141,232,255,.04);
  opacity:.30;
}

.holo-disc2{
  width:218px;
  height:58px;
  transform:translate(-50%,38px) perspective(700px) rotateX(76deg);
  border:1px dashed rgba(141,232,255,.08);
  opacity:.20;
}

.core-shell{
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 40%,
      rgba(130,225,255,.10),
      rgba(32,72,95,.06) 45%,
      rgba(8,18,26,.35) 66%,
      transparent 78%);
  box-shadow:
    inset 0 0 30px rgba(141,232,255,.05),
    0 0 16px rgba(141,232,255,.04);
  opacity:.95;
}

.main-ring,
.inner-ring,
.scan-ring,
.thinking-ring,
.arc-ring{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.main-ring{
  inset:30px;
  border:1px solid rgba(141,232,255,.34);
  animation:rotateClockwise 20s linear infinite;
}

.main-ring:before,
.main-ring:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:var(--glow);
  box-shadow:0 0 8px rgba(141,232,255,.8);
}

.main-ring:before{
  width:5px;
  height:5px;
  top:22px;
  left:14px;
}

.main-ring:after{
  width:3px;
  height:3px;
  right:19px;
  bottom:28px;
}

.inner-ring{
  inset:48px;
  border:1px dashed rgba(141,232,255,.25);
  opacity:.60;
  animation:rotateCounter 26s linear infinite;
}

.scan-ring{
  inset:16px;
  border:1px solid transparent;
  border-top-color:rgba(141,232,255,.18);
  border-right-color:rgba(141,232,255,.04);
  opacity:.22;
  animation:rotateClockwise 34s linear infinite;
}

.arc-ring{
  inset:66px;
  border:2px solid transparent;
  border-top-color:rgba(141,232,255,.28);
  border-left-color:rgba(141,232,255,.10);
  opacity:.55;
  animation:rotateCounter 10s linear infinite;
}

.thinking-ring{
  inset:4px;
  opacity:0;
  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(141,232,255,.42) 0deg 2deg,
      transparent 2deg 12deg
    );
  mask:radial-gradient(circle, transparent 64%, #000 65% 68%, transparent 69%);
  -webkit-mask:radial-gradient(circle, transparent 64%, #000 65% 68%, transparent 69%);
  transition:opacity .25s;
}

.voice-wave{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  will-change:transform,opacity,box-shadow;
  transition:transform .07s linear, opacity .07s linear, border-color .07s linear, box-shadow .07s linear;
}

.wave1{
  inset:28px;
  border:2px solid rgba(141,232,255,.14);
  opacity:.07;
}

.wave2{
  inset:8px;
  border:2px solid rgba(141,232,255,.09);
  opacity:.04;
}

.wave3{
  inset:-16px;
  border:1px solid rgba(141,232,255,.06);
  opacity:.02;
}

.audio-spectrum{
  position:absolute;
  left:50%;
  top:50%;
  width:250px;
  height:250px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:0;
  transition:opacity .18s ease;
}

.core-halo{
  position:absolute;
  inset:63px;
  border-radius:50%;
  border:1px solid rgba(141,232,255,.22);
  box-shadow:
    0 0 13px rgba(141,232,255,.10),
    inset 0 0 14px rgba(141,232,255,.07);
  transition:transform .10s, opacity .15s, box-shadow .10s;
}

.inner-lens{
  position:absolute;
  inset:78px;
  border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(141,232,255,.11),
      rgba(141,232,255,.02) 58%,
      transparent 70%);
  opacity:.8;
  pointer-events:none;
}

.core-dot{
  position:relative;
  z-index:20;
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid rgba(141,232,255,.94);
  background:
    radial-gradient(circle,
      rgba(141,232,255,.18),
      rgba(141,232,255,.015) 70%);
  box-shadow:
    0 0 18px rgba(141,232,255,.45),
    inset 0 0 14px rgba(141,232,255,.22);
  transition:transform .08s, box-shadow .08s;
}

/* =========================================================
   STATES
========================================================= */

.panel.standby .scene-glow{ opacity:.16; }
.panel.standby .core-ambient{ opacity:.22; }
.panel.standby .main-ring{ opacity:.42; }
.panel.standby .inner-ring{ opacity:.28; }
.panel.standby .core-dot{ animation:standbyBreath 4s ease-in-out infinite; }

.panel.listening .scene-glow{
  opacity:.24;
  transform:translate(-50%,-50%) scale(1.02);
}
.panel.listening .core-ambient{ opacity:.34; }
.panel.listening .main-ring{
  opacity:.68;
  animation-duration:13s;
}
.panel.listening .inner-ring{ opacity:.48; }
.panel.listening .arc-ring{ opacity:.72; }
.panel.listening .core-halo{
  animation:listeningBreath 1.4s ease-in-out infinite;
}
.panel.listening .core-dot{
  box-shadow:
    0 0 24px rgba(141,232,255,.60),
    inset 0 0 16px rgba(141,232,255,.24);
}

.panel.analysing{
  background:
    radial-gradient(circle at 50% 44%, rgba(64,157,194,.08), transparent 25%),
    linear-gradient(180deg, #050d13, #020609);
}
.panel.analysing .scene-glow{ opacity:.18; }
.panel.analysing .core-ambient{ opacity:.18; }
.panel.analysing .main-ring{
  animation-duration:2.3s;
  opacity:.58;
}
.panel.analysing .inner-ring{
  animation-duration:3.2s;
  opacity:.70;
}
.panel.analysing .scan-ring{
  opacity:.72;
  animation-duration:1.4s;
}
.panel.analysing .thinking-ring{
  opacity:.60;
  animation:rotateClockwise 2.2s linear infinite;
}
.panel.analysing .core-dot{
  animation:thinkingPulse .8s ease-in-out infinite;
  box-shadow:
    0 0 18px rgba(141,232,255,.38),
    inset 0 0 20px rgba(30,90,115,.38);
}

.panel.speaking .scene-glow{
  opacity:.30; /* bewust minder fel */
  transform:translate(-50%,-50%) scale(1.05);
}
.panel.speaking .core-ambient{
  opacity:.46;
  transform:scale(1.08);
}
.panel.speaking .main-ring{
  opacity:.84;
  animation-duration:10s;
}
.panel.speaking .inner-ring{
  opacity:.62;
  animation-duration:12s;
}
.panel.speaking .arc-ring{ opacity:.75; }
.panel.speaking .audio-spectrum{ opacity:.62; } /* subtieler */
.panel.speaking .waveform-line{ opacity:.96; }  /* belangrijkste */
.panel.speaking .core-dot{
  box-shadow:
    0 0 28px rgba(141,232,255,.85),
    inset 0 0 18px rgba(141,232,255,.30);
}

/* =========================================================
   TEXT
========================================================= */

h1{
  margin:8px 0 7px;
  padding-left:.32em;
  font-size:15px;
  letter-spacing:.32em;
  font-weight:600;
}

.status{
  min-height:16px;
  color:var(--glow);
  font-size:11px;
  letter-spacing:.20em;
}

.message{
  min-height:16px;
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}

/* =========================================================
   VOICE BUTTON
========================================================= */

.voice-button{
  margin-top:18px;
  padding:9px 18px;
  border-radius:8px;
  border:1px solid rgba(141,232,255,.26);
  background:rgba(8,25,36,.60);
  color:var(--glow);
  font-size:9px;
  letter-spacing:.18em;
  cursor:pointer;
  transition:.2s;
}

.voice-button.active{
  border-color:rgba(141,232,255,.65);
  box-shadow:0 0 16px rgba(141,232,255,.12);
}

.voice-button:disabled{
  opacity:.40;
}

/* =========================================================
   BOTTOM DATA
========================================================= */

.bottom{
  position:absolute;
  left:14px;
  right:14px;
  bottom:12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.metric{
  padding-top:7px;
  text-align:center;
  border-top:1px solid rgba(141,232,255,.13);
}

.metric b{
  display:block;
  font-size:12px;
  font-weight:500;
}

.metric span{
  color:var(--muted);
  font-size:8px;
  letter-spacing:.13em;
}

.stale{ opacity:.50; }

/* =========================================================
   KEYFRAMES
========================================================= */

@keyframes rotateClockwise{
  to{ transform:rotate(360deg); }
}

@keyframes rotateCounter{
  to{ transform:rotate(-360deg); }
}

@keyframes standbyBreath{
  50%{
    transform:scale(1.04);
    opacity:.88;
  }
}

@keyframes listeningBreath{
  50%{
    transform:scale(1.12);
    box-shadow:0 0 22px rgba(141,232,255,.20);
  }
}

@keyframes thinkingPulse{
  50%{
    transform:scale(.88);
    opacity:.65;
  }
}

/* =========================================================
   SMALLER SCREENS
========================================================= */

@media(max-height:520px){
  .core-wrap{ height:240px; }
  .core{
    width:184px;
    height:184px;
  }
  .waveform-line{
    width:min(92vw,520px);
    height:95px;
  }
  .audio-spectrum{
    width:220px;
    height:220px;
  }
}
</style>
</head>

<body>

<div class="auth-gate" id="authGate">
  <form class="auth-card" id="loginForm">
    <div class="auth-core"></div>
    <div class="auth-title">J.A.R.V.I.S.</div>
    <div class="auth-subtitle">AUTHORISED ACCESS ONLY</div>

    <input id="email" type="email" placeholder="Email address" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>

    <button id="loginButton" type="submit">
      AUTHENTICATE
    </button>

    <div class="auth-error" id="authError"></div>
  </form>
</div>

<div class="panel standby" id="panel">

  <div class="scene-glow" id="sceneGlow"></div>

  <div class="top">
    <div>J.A.R.V.I.S.</div>

    <div class="online">
      <span class="dot"></span>
      <span id="linkState">ONLINE</span>

      <button class="logout" id="logoutButton">
        LOG OUT
      </button>
    </div>
  </div>

  <div class="centre">

    <div class="core-wrap">

      <canvas class="waveform-line" id="waveformLine" width="1240" height="240"></canvas>

      <div class="core" id="core">

        <div class="core-shadow"></div>
        <div class="core-ambient" id="coreAmbient"></div>

        <div class="holo-disc"></div>
        <div class="holo-disc2"></div>

        <div class="voice-wave wave3" id="wave3"></div>
        <div class="voice-wave wave2" id="wave2"></div>
        <div class="voice-wave wave1" id="wave1"></div>

        <canvas class="audio-spectrum" id="audioSpectrum" width="520" height="520"></canvas>

        <div class="core-shell"></div>
        <div class="thinking-ring"></div>
        <div class="scan-ring"></div>
        <div class="main-ring"></div>
        <div class="inner-ring"></div>
        <div class="arc-ring"></div>

        <div class="core-halo" id="coreHalo"></div>
        <div class="inner-lens"></div>
        <div class="core-dot" id="coreDot"></div>

      </div>
    </div>

    <h1>JARVIS</h1>

    <div class="status" id="status">
      SYSTEM INTEGRITY 100%
    </div>

    <div class="message" id="message">
      Standing by, sir.
    </div>

    <button class="voice-button" id="voiceButton">
      ACTIVATE VOICE
    </button>

  </div>

  <div class="bottom">
    <div class="metric">
      <b id="temp">--.-°C</b>
      <span>HOME</span>
    </div>

    <div class="metric">
      <b id="solar">-- kW</b>
      <span>SOLAR</span>
    </div>

    <div class="metric">
      <b id="bmw">--%</b>
      <span>BMW</span>
    </div>

    <div class="metric">
      <b id="grid">-- kW</b>
      <span>GRID</span>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://hibrzsnwkbngaaujdvxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_yJBOE5AnX7-N8EkV98LNnA_LJ0KEz-P";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const el = id => document.getElementById(id);

let refreshTimer = null;
let peerConnection = null;
let dataChannel = null;
let localStream = null;
let remoteAudio = null;

let voicePhase = "disconnected";
let baseStatus = "SYSTEM INTEGRITY 100%";
let baseMessage = "Standing by, sir.";

/* =========================================================
   AUDIO ANALYSIS
========================================================= */

let audioContext = null;
let remoteAnalyser = null;
let remoteSource = null;
let audioTimeData = null;
let audioFreqData = null;
let animationFrame = null;
let smoothLevel = 0;

async function setupAudioVisuals(stream){
  try{
    resetAudioVisuals();

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if(!AudioContextClass) return;

    audioContext = new AudioContextClass();

    if(audioContext.state === "suspended"){
      await audioContext.resume();
    }

    remoteAnalyser = audioContext.createAnalyser();
    remoteAnalyser.fftSize = 512;
    remoteAnalyser.smoothingTimeConstant = .70;

    audioTimeData = new Uint8Array(remoteAnalyser.fftSize);
    audioFreqData = new Uint8Array(remoteAnalyser.frequencyBinCount);

    remoteSource = audioContext.createMediaStreamSource(stream);
    remoteSource.connect(remoteAnalyser);

    animateAudio();
  } catch(error){
    console.warn("Audio visualiser:", error);
  }
}

function drawSpectrum(frequencies, level){
  const canvas = el("audioSpectrum");
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0,0,w,h);

  if(voicePhase !== "speaking") return;

  const cx = w / 2;
  const cy = h / 2;
  const bars = 56;
  const baseRadius = 150;

  for(let i = 0; i < bars; i++){
    const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
    const freqIndex = Math.floor((i / bars) * Math.min(frequencies.length, 96));
    const value = frequencies[freqIndex] / 255;
    const strength = Math.max(value, level * .35);
    const length = 4 + strength * 26;

    const x1 = cx + Math.cos(angle) * baseRadius;
    const y1 = cy + Math.sin(angle) * baseRadius;
    const x2 = cx + Math.cos(angle) * (baseRadius + length);
    const y2 = cy + Math.sin(angle) * (baseRadius + length);

    const alpha = .05 + strength * .42;

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle = `rgba(141,232,255,${alpha})`;
    ctx.lineWidth = 1.6 + strength * 1.1;
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(141,232,255,.42)";
    ctx.shadowBlur = strength * 8;
    ctx.stroke();
  }

  ctx.shadowBlur = 0;
}

function drawWaveformLine(timeData, level){
  const canvas = el("waveformLine");
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  const mid = h / 2;

  ctx.clearRect(0,0,w,h);

  if(voicePhase !== "speaking") return;

  const startX = w * .12;
  const endX = w * .88;
  const usableWidth = endX - startX;
  const amp = 10 + level * 68;

  /* soft base glow line */
  ctx.beginPath();
  ctx.moveTo(startX, mid);
  ctx.lineTo(endX, mid);
  ctx.strokeStyle = "rgba(141,232,255,.08)";
  ctx.lineWidth = 2;
  ctx.shadowColor = "rgba(141,232,255,.18)";
  ctx.shadowBlur = 14;
  ctx.stroke();

  /* waveform */
  ctx.beginPath();

  for(let i = 0; i < timeData.length; i++){
    const x = startX + (i / (timeData.length - 1)) * usableWidth;
    const n = (timeData[i] - 128) / 128;
    const y = mid + n * amp;

    if(i === 0){
      ctx.moveTo(x,y);
    } else {
      ctx.lineTo(x,y);
    }
  }

  ctx.strokeStyle = `rgba(141,232,255,${.46 + level * .42})`;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowColor = "rgba(141,232,255,.55)";
  ctx.shadowBlur = 18 + level * 12;
  ctx.stroke();

  /* hot centre highlight */
  const grad = ctx.createLinearGradient(w * .36, 0, w * .64, 0);
  grad.addColorStop(0, "rgba(141,232,255,0)");
  grad.addColorStop(.5, `rgba(141,232,255,${.10 + level * .25})`);
  grad.addColorStop(1, "rgba(141,232,255,0)");

  ctx.fillStyle = grad;
  ctx.fillRect(startX, mid - (12 + level * 14), usableWidth, 24 + level * 28);

  ctx.shadowBlur = 0;
}

function animateAudio(){
  if(!remoteAnalyser || !audioTimeData || !audioFreqData) return;

  remoteAnalyser.getByteTimeDomainData(audioTimeData);
  remoteAnalyser.getByteFrequencyData(audioFreqData);

  let sum = 0;
  for(let i = 0; i < audioTimeData.length; i++){
    const n = (audioTimeData[i] - 128) / 128;
    sum += n * n;
  }

  const rms = Math.sqrt(sum / audioTimeData.length);

  let level = (rms - .005) * 13;
  level = Math.max(0, Math.min(1, level));

  smoothLevel = smoothLevel * .68 + level * .32;
  const v = smoothLevel;

  animateWave("wave1", 1 + v * .28, .07 + v * .34, 10 + v * 18);
  animateWave("wave2", 1 + v * .46, .04 + v * .22, 14 + v * 24);
  animateWave("wave3", 1 + v * .66, .02 + v * .12, 18 + v * 30);

  const dot = el("coreDot");
  dot.style.transform = `scale(${1 + v * .12})`;

  const halo = el("coreHalo");
  halo.style.transform = `scale(${1 + v * .14})`;
  halo.style.boxShadow =
    `0 0 ${12 + v * 14}px rgba(141,232,255,${.08 + v * .12}),
     inset 0 0 ${12 + v * 10}px rgba(141,232,255,${.06 + v * .08})`;

  const ambient = el("coreAmbient");
  ambient.style.transform = `scale(${1 + v * .10})`;

  const core = el("core");
  core.style.transform = `translateY(${-v * 2}px) scale(${1 + v * .015})`;

  drawSpectrum(audioFreqData, v);
  drawWaveformLine(audioTimeData, v);

  animationFrame = requestAnimationFrame(animateAudio);
}

function animateWave(id, scale, opacity, blur){
  const node = el(id);
  node.style.transform = `scale(${scale})`;
  node.style.opacity = opacity;
  node.style.boxShadow =
    `0 0 ${blur}px rgba(141,232,255,${Math.min(.24, opacity * .55)})`;
}

function resetAudioVisuals(){
  if(animationFrame){
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  smoothLevel = 0;

  const defaults = {
    wave1:.07,
    wave2:.04,
    wave3:.02
  };

  Object.entries(defaults).forEach(([id,opacity]) => {
    const node = el(id);
    if(node){
      node.style.transform = "scale(1)";
      node.style.opacity = opacity;
      node.style.boxShadow = "none";
    }
  });

  const spectrum = el("audioSpectrum").getContext("2d");
  spectrum.clearRect(0,0,el("audioSpectrum").width,el("audioSpectrum").height);

  const waveform = el("waveformLine").getContext("2d");
  waveform.clearRect(0,0,el("waveformLine").width,el("waveformLine").height);

  el("coreDot").style.transform = "scale(1)";
  el("coreHalo").style.transform = "scale(1)";
  el("coreHalo").style.boxShadow = "0 0 13px rgba(141,232,255,.10), inset 0 0 14px rgba(141,232,255,.07)";
  el("coreAmbient").style.transform = "scale(1)";
  el("core").style.transform = "translateY(0) scale(1)";

  remoteAnalyser = null;
  remoteSource = null;
  audioTimeData = null;
  audioFreqData = null;

  if(audioContext){
    try{ audioContext.close(); } catch{}
    audioContext = null;
  }
}

/* =========================================================
   HOME DATA
========================================================= */

function fmtKw(value){
  if(value === null || value === undefined || Number.isNaN(Number(value))){
    return "-- kW";
  }
  return `${(Number(value) / 1000).toFixed(2)} kW`;
}

function restoreBaseStatus(){
  if(voicePhase !== "disconnected") return;

  el("status").textContent = baseStatus;
  el("message").textContent = baseMessage;
}

async function loadData(){
  try{
    const { data, error } = await supabase
      .from("jarvis_status")
      .select("id,temperature,solar,bmw,grid,updated_at")
      .eq("id",1)
      .single();

    if(error) throw error;

    el("temp").textContent =
      data.temperature == null ? "--.-°C" : `${Number(data.temperature).toFixed(1)}°C`;

    el("solar").textContent = fmtKw(data.solar);
    el("bmw").textContent = data.bmw == null ? "--%" : `${Math.round(Number(data.bmw))}%`;
    el("grid").textContent = fmtKw(data.grid);

    const updated = data.updated_at ? new Date(data.updated_at) : null;
    const age = updated ? (Date.now() - updated.getTime()) / 1000 : 999999;

    if(age > 180){
      baseStatus = "DATA LINK STALE";
      baseMessage = "Home data has not been updated recently, sir.";
      document.querySelector(".bottom").classList.add("stale");
    } else {
      baseStatus = "SYSTEM INTEGRITY 100%";
      baseMessage = "Standing by, sir.";
      document.querySelector(".bottom").classList.remove("stale");
    }

    el("linkState").textContent = "ONLINE";
    restoreBaseStatus();

  } catch(error){
    console.error(error);

    baseStatus = "DATA LINK DEGRADED";
    baseMessage = "I appear to have misplaced Homey, sir.";

    el("linkState").textContent = "LINK DEGRADED";
    restoreBaseStatus();
  }
}

/* =========================================================
   AUTH
========================================================= */

function showLogin(){
  stopVoice(false);

  el("authGate").style.display = "flex";
  el("panel").style.display = "none";

  if(refreshTimer){
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

function showDashboard(){
  el("authGate").style.display = "none";
  el("panel").style.display = "block";

  setVisualState("standby");
  loadData();

  if(!refreshTimer){
    refreshTimer = setInterval(loadData, 5000);
  }
}

/* =========================================================
   VISUAL STATE
========================================================= */

function setVisualState(state){
  const panel = el("panel");
  panel.classList.remove("standby","listening","analysing","speaking");
  panel.classList.add(state);
}

function setVoicePhase(phase){
  voicePhase = phase;

  if(phase === "connecting"){
    setVisualState("analysing");
    el("status").textContent = "ESTABLISHING VOICE LINK";
    el("message").textContent = "Securing realtime channel...";
  }

  if(phase === "listening"){
    setVisualState("listening");
    el("status").textContent = "LISTENING";
    el("message").textContent = "Voice link active.";
  }

  if(phase === "analysing"){
    setVisualState("analysing");
    el("status").textContent = "ANALYSING";
    el("message").textContent = "Processing...";
  }

  if(phase === "speaking"){
    setVisualState("speaking");
    el("status").textContent = "SPEAKING";
    el("message").textContent = "JARVIS voice channel active.";
  }

  if(phase === "disconnected"){
    setVisualState("standby");
    restoreBaseStatus();
  }
}

/* =========================================================
   REALTIME EVENTS
========================================================= */

function handleRealtimeEvent(event){
  const type = event?.type || "";

  if(type === "input_audio_buffer.speech_started"){
    setVoicePhase("listening");
    return;
  }

  if(type === "input_audio_buffer.speech_stopped"){
    setVoicePhase("analysing");
    return;
  }

  if(type === "response.created"){
    setVoicePhase("analysing");
    return;
  }

  if((type.includes("audio") && type.includes("delta")) || type === "response.output_audio.delta"){
    setVoicePhase("speaking");
    return;
  }

  if(type === "response.done" || type === "response.completed"){
    setVoicePhase("listening");
    return;
  }

  if(type === "error"){
    console.error(event);
    el("status").textContent = "VOICE LINK ERROR";
    el("message").textContent =
      event?.error?.message || "Realtime channel reported an error.";
  }
}

/* =========================================================
   START VOICE
========================================================= */

async function startVoice(){
  if(peerConnection) return;

  const button = el("voiceButton");
  button.disabled = true;
  button.textContent = "CONNECTING...";
  setVoicePhase("connecting");

  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Microphone access is unavailable in this browser.");
    }

    const { data:tokenData, error:tokenError } =
      await supabase.functions.invoke("jarvis-realtime", { body:{} });

    if(tokenError) throw tokenError;

    const key = tokenData?.value;
    if(!key){
      throw new Error("No ephemeral realtime key returned.");
    }

    const pc = new RTCPeerConnection();
    peerConnection = pc;

    const audio = document.createElement("audio");
    audio.autoplay = true;
    audio.playsInline = true;
    audio.style.display = "none";
    document.body.appendChild(audio);
    remoteAudio = audio;

    pc.ontrack = event => {
      const stream = event.streams[0];
      audio.srcObject = stream;
      setupAudioVisuals(stream);

      audio.play().catch(error => console.warn(error));
    };

    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

    localStream = stream;
    const track = stream.getAudioTracks()[0];
    pc.addTrack(track, stream);

    const dc = pc.createDataChannel("oai-events");
    dataChannel = dc;

    dc.addEventListener("open", () => {
      button.disabled = false;
      button.textContent = "DISCONNECT VOICE";
      button.classList.add("active");
      setVoicePhase("listening");
    });

    dc.addEventListener("message", event => {
      try{
        const message = JSON.parse(event.data);
        handleRealtimeEvent(message);
      } catch(error){
        console.warn(error);
      }
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const response = await fetch("https://api.openai.com/v1/realtime/calls", {
      method:"POST",
      body:offer.sdp,
      headers:{
        "Authorization": `Bearer ${key}`,
        "Content-Type":"application/sdp"
      }
    });

    if(!response.ok){
      throw new Error(await response.text());
    }

    await pc.setRemoteDescription({
      type:"answer",
      sdp: await response.text()
    });

    pc.addEventListener("connectionstatechange", () => {
      if(peerConnection !== pc) return;

      if(pc.connectionState === "failed" || pc.connectionState === "closed"){
        stopVoice();
      }
    });

  } catch(error){
    console.error(error);

    stopVoice(false);

    el("status").textContent = "VOICE LINK FAILED";
    el("message").textContent = error?.message || "Realtime connection failed.";

    button.disabled = false;
    button.textContent = "RETRY VOICE";
  }
}

/* =========================================================
   STOP VOICE
========================================================= */

function stopVoice(updateUi = true){
  const pc = peerConnection;
  const dc = dataChannel;

  peerConnection = null;
  dataChannel = null;

  resetAudioVisuals();

  if(localStream){
    for(const track of localStream.getTracks()){
      track.stop();
    }
    localStream = null;
  }

  if(remoteAudio){
    try{
      remoteAudio.pause();
      remoteAudio.remove();
    } catch{}
    remoteAudio = null;
  }

  try{ dc?.close(); }catch{}
  try{ pc?.close(); }catch{}

  voicePhase = "disconnected";

  const button = el("voiceButton");
  button.disabled = false;
  button.textContent = "ACTIVATE VOICE";
  button.classList.remove("active");

  setVisualState("standby");

  if(updateUi){
    restoreBaseStatus();
  }
}

/* =========================================================
   BUTTONS
========================================================= */

el("voiceButton").addEventListener("click", async () => {
  if(peerConnection){
    stopVoice();
  } else {
    await startVoice();
  }
});

el("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const email = el("email").value.trim();
  const password = el("password").value;
  const button = el("loginButton");

  button.disabled = true;
  button.textContent = "AUTHENTICATING...";

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  button.disabled = false;
  button.textContent = "AUTHENTICATE";

  if(error){
    el("authError").textContent = "ACCESS DENIED";
    return;
  }

  el("password").value = "";
  showDashboard();
});

el("logoutButton").addEventListener("click", async () => {
  stopVoice(false);

  await supabase.auth.signOut({
    scope:"local"
  });

  showLogin();
});

/* =========================================================
   SESSION
========================================================= */

const { data:{ session } } = await supabase.auth.getSession();

if(session){
  showDashboard();
} else {
  showLogin();
}

supabase.auth.onAuthStateChange((event, session) => {
  if(event === "SIGNED_OUT"){
    showLogin();
  }

  if(event === "SIGNED_IN" && session){
    showDashboard();
  }
});
</script>
