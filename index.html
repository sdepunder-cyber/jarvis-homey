<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>J.A.R.V.I.S.</title>

<style>

:root{
  --bg:#02070c;
  --bg2:#07111a;
  --text:#eaf8ff;
  --muted:#78919d;
  --cyan:#8de8ff;
  --cyan2:#5ec9ee;
  --cyan3:#b8f4ff;
  --danger:#ff8f8f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02070c;
  color:var(--text);

  font-family:
    Inter,
    Arial,
    sans-serif;
}

body{
  display:flex;
}


/* =========================================================
   LOGIN
========================================================= */

.auth-gate{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(65,182,222,.12),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      #08121c,
      #03090e
    );
}

.auth-card{
  width:min(360px,100%);
  padding:32px 28px;

  text-align:center;

  border-radius:14px;

  border:
    1px solid
    rgba(141,232,255,.18);

  background:
    rgba(5,15,23,.92);

  box-shadow:
    0 0 60px rgba(95,210,255,.05),
    inset 0 0 35px rgba(95,210,255,.025);
}

.auth-core{
  position:relative;

  width:76px;
  height:76px;

  margin:0 auto 24px;

  border-radius:50%;

  border:
    1px solid
    rgba(141,232,255,.60);

  box-shadow:
    0 0 22px
    rgba(141,232,255,.20);
}

.auth-core:before,
.auth-core:after{
  content:"";

  position:absolute;

  border-radius:50%;

  border:
    1px dashed
    rgba(141,232,255,.25);
}

.auth-core:before{
  inset:10px;
}

.auth-core:after{
  inset:25px;
}

.auth-title{
  margin-bottom:7px;

  padding-left:.32em;

  font-size:16px;

  letter-spacing:.32em;
}

.auth-subtitle{
  margin-bottom:25px;

  color:var(--muted);

  font-size:10px;

  letter-spacing:.18em;
}

.auth-card input{
  width:100%;

  margin-bottom:11px;

  padding:12px 13px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.18);

  outline:none;

  background:
    rgba(3,10,16,.92);

  color:var(--text);

  font-size:14px;
}

.auth-card input:focus{
  border-color:
    rgba(141,232,255,.60);

  box-shadow:
    0 0 12px
    rgba(141,232,255,.08);
}

.auth-card button{
  width:100%;

  padding:12px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.42);

  background:
    rgba(10,32,45,.72);

  color:var(--text);

  font-size:11px;

  letter-spacing:.16em;

  cursor:pointer;
}

.auth-error{
  min-height:18px;

  margin-top:13px;

  color:var(--danger);

  font-size:10px;
}


/* =========================================================
   PANEL
========================================================= */

.panel{
  display:none;

  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  perspective:1100px;

  background:
    radial-gradient(
      ellipse at 50% 44%,
      rgba(58,154,194,.075),
      transparent 27%
    ),
    linear-gradient(
      180deg,
      #07111a,
      #020609
    );

  transition:
    background .35s ease;
}


/* =========================================================
   BACKGROUND
========================================================= */

.scene-glow{
  position:absolute;

  left:50%;
  top:47%;

  width:420px;
  height:420px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(141,232,255,.05),
      rgba(141,232,255,.017) 38%,
      transparent 68%
    );

  filter:
    blur(44px);

  opacity:.13;

  pointer-events:none;

  transition:
    opacity .3s,
    transform .3s;
}


/* =========================================================
   TOP
========================================================= */

.top{
  position:relative;
  z-index:20;

  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:
    15px 18px 4px;

  color:var(--muted);

  font-size:12px;

  letter-spacing:.18em;
}

.online{
  display:flex;

  align-items:center;

  gap:7px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--cyan);

  box-shadow:
    0 0 10px
    var(--cyan);
}

.logout{
  margin-left:10px;

  border:0;

  background:none;

  color:var(--muted);

  font-size:8px;

  letter-spacing:.12em;

  cursor:pointer;

  opacity:.60;
}

.logout:hover{
  opacity:1;
  color:var(--text);
}


/* =========================================================
   CENTRE
========================================================= */

.centre{
  position:absolute;

  left:50%;
  top:48%;

  transform:
    translate(-50%,-50%);

  width:min(96%,620px);

  text-align:center;
}


/* =========================================================
   STAGE
========================================================= */

.core-stage{
  position:relative;

  width:100%;
  height:310px;

  display:flex;

  justify-content:center;
  align-items:center;

  transform-style:
    preserve-3d;
}


/* =========================================================
   CORE
========================================================= */

.core{
  position:relative;

  width:235px;
  height:235px;

  z-index:10;

  display:flex;

  justify-content:center;
  align-items:center;

  transform-style:
    preserve-3d;

  transform:
    rotateX(5deg)
    rotateY(-4deg);

  transition:
    transform .15s linear,
    filter .18s ease;
}


/* =========================================================
   REAR SPHERE
========================================================= */

.sphere{
  position:absolute;

  inset:35px;

  z-index:5;

  border-radius:50%;

  transform:
    translateZ(-12px);

  background:
    radial-gradient(
      circle at 35% 27%,
      rgba(220,250,255,.16),
      rgba(141,232,255,.05) 21%,
      rgba(30,77,100,.035) 47%,
      rgba(0,0,0,.30) 71%,
      transparent 77%
    );

  box-shadow:
    inset -18px -20px 30px
      rgba(0,0,0,.38),

    inset 11px 10px 22px
      rgba(141,232,255,.04),

    0 0 18px
      rgba(141,232,255,.035);

  pointer-events:none;
}


/* =========================================================
   DEPTH SHADE
========================================================= */

.depth-shade{
  position:absolute;

  inset:37px;

  z-index:12;

  border-radius:50%;

  pointer-events:none;

  background:
    linear-gradient(
      110deg,
      rgba(255,255,255,.018),
      transparent 29%,
      transparent 58%,
      rgba(0,0,0,.16)
    );

  box-shadow:
    inset -20px -8px 28px
    rgba(0,0,0,.17);
}


/* =========================================================
   ORBITAL RINGS
========================================================= */

.orbit{
  position:absolute;

  left:50%;
  top:50%;

  border-radius:50%;

  pointer-events:none;

  transform-style:
    preserve-3d;

  mask-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.35),
      #000 27%,
      #000 69%,
      rgba(0,0,0,.28)
    );

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.35),
      #000 27%,
      #000 69%,
      rgba(0,0,0,.28)
    );
}

.orbit-a{
  width:238px;
  height:238px;

  border:
    1px solid
    rgba(141,232,255,.22);

  animation:
    orbitA
    21s linear infinite;
}

.orbit-b{
  width:217px;
  height:217px;

  border:
    1px dashed
    rgba(141,232,255,.17);

  animation:
    orbitB
    27s linear infinite;
}

.orbit-c{
  width:198px;
  height:198px;

  border:
    1px solid
    rgba(141,232,255,.10);

  animation:
    orbitC
    33s linear infinite;
}


/* =========================================================
   SEGMENT ARCS
========================================================= */

.segment-arc{
  position:absolute;

  left:50%;
  top:50%;

  border-radius:50%;

  pointer-events:none;

  transform-style:
    preserve-3d;
}

.segment-a{
  width:265px;
  height:265px;

  border:
    2px solid transparent;

  border-top-color:
    rgba(141,232,255,.19);

  border-right-color:
    rgba(141,232,255,.04);

  transform:
    translate(-50%,-50%)
    rotateZ(27deg)
    rotateX(13deg);

  opacity:.44;

  animation:
    segmentA
    15s linear infinite;
}

.segment-b{
  width:250px;
  height:250px;

  border:
    1px solid transparent;

  border-bottom-color:
    rgba(141,232,255,.16);

  border-left-color:
    rgba(141,232,255,.04);

  transform:
    translate(-50%,-50%)
    rotateZ(-38deg)
    rotateY(16deg);

  opacity:.34;

  animation:
    segmentB
    20s linear infinite;
}

.segment-c{
  width:184px;
  height:184px;

  border:
    2px solid transparent;

  border-top-color:
    rgba(184,244,255,.16);

  border-left-color:
    rgba(141,232,255,.035);

  transform:
    translate(-50%,-50%)
    rotateZ(78deg);

  opacity:.36;

  animation:
    segmentC
    12s linear infinite;
}


/* =========================================================
   MAIN RINGS
========================================================= */

.main-ring,
.inner-ring,
.scan-ring,
.arc-ring,
.thinking-ring,
.scanner-sweep{
  position:absolute;

  border-radius:50%;

  pointer-events:none;
}

.main-ring{
  inset:32px;

  transform:
    translateZ(15px);

  border:
    1px solid
    rgba(141,232,255,.33);

  animation:
    rotateClockwise
    19s linear infinite;
}

.main-ring:before,
.main-ring:after{
  content:"";

  position:absolute;

  border-radius:50%;

  background:
    var(--cyan);

  box-shadow:
    0 0 8px
    rgba(141,232,255,.75);
}

.main-ring:before{
  width:5px;
  height:5px;

  left:16px;
  top:28px;
}

.main-ring:after{
  width:3px;
  height:3px;

  right:19px;
  bottom:31px;
}

.inner-ring{
  inset:51px;

  transform:
    translateZ(28px);

  border:
    1px dashed
    rgba(141,232,255,.22);

  opacity:.50;

  animation:
    rotateCounter
    25s linear infinite;
}

.scan-ring{
  inset:18px;

  border:
    1px solid
    transparent;

  border-top-color:
    rgba(141,232,255,.16);

  border-right-color:
    rgba(141,232,255,.03);

  opacity:.18;

  animation:
    rotateClockwise
    32s linear infinite;
}

.arc-ring{
  inset:71px;

  transform:
    translateZ(40px);

  border:
    2px solid
    transparent;

  border-top-color:
    rgba(141,232,255,.27);

  border-left-color:
    rgba(141,232,255,.075);

  opacity:.55;

  animation:
    rotateCounter
    10s linear infinite;
}


/* =========================================================
   THINKING
========================================================= */

.thinking-ring{
  inset:3px;

  opacity:0;

  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(141,232,255,.40) 0deg 2deg,
      transparent 2deg 13deg
    );

  mask:
    radial-gradient(
      circle,
      transparent 65%,
      #000 66% 68%,
      transparent 69%
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 65%,
      #000 66% 68%,
      transparent 69%
    );

  transition:
    opacity .20s;
}


/* =========================================================
   SCANNER SWEEP
========================================================= */

.scanner-sweep{
  inset:-3px;

  opacity:0;

  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 320deg,
      rgba(141,232,255,.04) 332deg,
      rgba(141,232,255,.45) 348deg,
      transparent 360deg
    );

  mask:
    radial-gradient(
      circle,
      transparent 68%,
      #000 69% 70%,
      transparent 71%
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 68%,
      #000 69% 70%,
      transparent 71%
    );
}


/* =========================================================
   AUDIO SPECTRUM
========================================================= */

.audio-spectrum{
  position:absolute;

  left:50%;
  top:50%;

  width:315px;
  height:315px;

  transform:
    translate(-50%,-50%)
    translateZ(50px);

  pointer-events:none;

  opacity:0;

  z-index:17;

  transition:
    opacity .12s ease;
}


/* =========================================================
   SUBTLE AUDIO RINGS
========================================================= */

.voice-wave{
  position:absolute;

  border-radius:50%;

  pointer-events:none;

  transition:
    transform .07s linear,
    opacity .07s linear,
    box-shadow .07s linear;
}

.wave1{
  inset:27px;

  border:
    1px solid
    rgba(141,232,255,.08);

  opacity:.03;
}

.wave2{
  inset:8px;

  border:
    1px solid
    rgba(141,232,255,.05);

  opacity:.018;
}


/* =========================================================
   GLASS CORE
========================================================= */

.core-halo{
  position:absolute;

  inset:67px;

  border-radius:50%;

  transform:
    translateZ(44px);

  border:
    1px solid
    rgba(141,232,255,.20);

  box-shadow:
    0 0 11px
      rgba(141,232,255,.075),

    inset 0 0 14px
      rgba(141,232,255,.055);

  transition:
    transform .08s,
    box-shadow .08s;
}

.inner-lens{
  position:absolute;

  inset:80px;

  border-radius:50%;

  transform:
    translateZ(52px);

  overflow:hidden;

  background:
    radial-gradient(
      circle at 34% 25%,
      rgba(229,252,255,.22),
      rgba(141,232,255,.09) 25%,
      rgba(40,104,135,.035) 54%,
      rgba(0,0,0,.10) 71%
    );

  box-shadow:
    inset -8px -10px 13px
      rgba(0,0,0,.28),

    inset 5px 4px 10px
      rgba(255,255,255,.045);
}

.inner-lens:before{
  content:"";

  position:absolute;

  width:44%;
  height:22%;

  left:16%;
  top:12%;

  border-radius:50%;

  transform:
    rotate(-22deg);

  background:
    radial-gradient(
      ellipse,
      rgba(225,252,255,.18),
      rgba(225,252,255,.04) 45%,
      transparent 70%
    );

  filter:
    blur(2px);
}

.inner-lens:after{
  content:"";

  position:absolute;

  left:12%;
  right:12%;
  bottom:8%;

  height:22%;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.18),
      transparent 70%
    );

  filter:
    blur(3px);
}

.core-dot{
  position:relative;

  z-index:30;

  width:34px;
  height:34px;

  border-radius:50%;

  transform:
    translateZ(70px);

  border:
    1px solid
    rgba(141,232,255,.95);

  background:
    radial-gradient(
      circle at 33% 25%,
      rgba(238,253,255,.30),
      rgba(141,232,255,.11) 31%,
      rgba(141,232,255,.018) 67%
    );

  box-shadow:
    0 0 18px
      rgba(141,232,255,.40),

    inset -6px -7px 10px
      rgba(0,0,0,.24),

    inset 4px 3px 8px
      rgba(255,255,255,.08);

  transition:
    transform .07s,
    box-shadow .07s;
}


/* =========================================================
   STANDBY
========================================================= */

.panel.standby .scene-glow{
  opacity:.10;
}

.panel.standby .orbit-a{
  opacity:.22;
}

.panel.standby .orbit-b{
  opacity:.15;
}

.panel.standby .orbit-c{
  opacity:.10;
}

.panel.standby .segment-a{
  opacity:.28;
}

.panel.standby .segment-b{
  opacity:.20;
}

.panel.standby .segment-c{
  opacity:.22;
}

.panel.standby .core-dot{
  animation:
    standbyBreath
    4.2s ease-in-out infinite;
}


/* =========================================================
   LISTENING
========================================================= */

.panel.listening .scene-glow{
  opacity:.17;

  transform:
    translate(-50%,-50%)
    scale(1.02);
}

.panel.listening .orbit-a{
  opacity:.39;
}

.panel.listening .orbit-b{
  opacity:.28;
}

.panel.listening .orbit-c{
  opacity:.19;
}

.panel.listening .segment-a{
  opacity:.42;
}

.panel.listening .segment-b{
  opacity:.31;
}

.panel.listening .segment-c{
  opacity:.34;
}

.panel.listening .main-ring{
  opacity:.67;

  animation-duration:
    13s;
}

.panel.listening .core-halo{
  animation:
    listeningBreath
    1.5s ease-in-out infinite;
}


/* =========================================================
   ANALYSING
========================================================= */

.panel.analysing{
  background:
    radial-gradient(
      ellipse at 50% 44%,
      rgba(53,133,167,.065),
      transparent 25%
    ),
    linear-gradient(
      180deg,
      #040b10,
      #010406
    );
}

.panel.analysing .scene-glow{
  opacity:.10;
}

.panel.analysing .thinking-ring{
  opacity:.55;

  animation:
    rotateClockwise
    2s linear infinite;
}

.panel.analysing .scanner-sweep{
  opacity:.76;

  animation:
    scannerSweep
    1.25s linear infinite;
}

.panel.analysing .main-ring{
  opacity:.58;

  animation-duration:
    2.1s;
}

.panel.analysing .inner-ring{
  opacity:.68;

  animation-duration:
    3s;
}

.panel.analysing .scan-ring{
  opacity:.69;

  animation-duration:
    1.25s;
}

.panel.analysing .orbit-a{
  opacity:.46;

  animation-duration:
    5s;
}

.panel.analysing .orbit-b{
  opacity:.34;

  animation-duration:
    6.5s;
}

.panel.analysing .orbit-c{
  opacity:.25;

  animation-duration:
    8s;
}

.panel.analysing .segment-a{
  opacity:.65;

  animation-duration:
    4s;
}

.panel.analysing .segment-b{
  opacity:.49;

  animation-duration:
    5s;
}

.panel.analysing .segment-c{
  opacity:.54;

  animation-duration:
    3s;
}

.panel.analysing .core{
  transform:
    rotateX(10deg)
    rotateY(7deg)
    scale(.985);
}

.panel.analysing .core-dot{
  animation:
    thinkingPulse
    .8s ease-in-out infinite;
}


/* =========================================================
   SPEAKING
========================================================= */

.panel.speaking .scene-glow{
  opacity:.17;

  transform:
    translate(-50%,-50%)
    scale(1.03);
}

.panel.speaking .audio-spectrum{
  opacity:1;
}

.panel.speaking .orbit-a{
  opacity:.36;
}

.panel.speaking .orbit-b{
  opacity:.25;
}

.panel.speaking .orbit-c{
  opacity:.17;
}

.panel.speaking .segment-a{
  opacity:.39;
}

.panel.speaking .segment-b{
  opacity:.28;
}

.panel.speaking .segment-c{
  opacity:.31;
}

.panel.speaking .main-ring{
  opacity:.65;

  animation-duration:
    10s;
}

.panel.speaking .inner-ring{
  opacity:.43;

  animation-duration:
    13s;
}

.panel.speaking .arc-ring{
  opacity:.62;
}

.panel.speaking .core-dot{
  box-shadow:
    0 0 26px
      rgba(141,232,255,.66),

    inset -6px -7px 10px
      rgba(0,0,0,.20),

    inset 4px 3px 9px
      rgba(255,255,255,.09);
}


/* =========================================================
   TEXT
========================================================= */

h1{
  margin:
    7px 0 7px;

  padding-left:.32em;

  font-size:15px;

  letter-spacing:.32em;

  font-weight:600;
}

.status{
  min-height:16px;

  color:var(--cyan);

  font-size:11px;

  letter-spacing:.20em;
}

.message{
  min-height:16px;

  margin-top:8px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   BUTTON
========================================================= */

.voice-button{
  margin-top:18px;

  padding:
    9px 18px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.26);

  background:
    rgba(8,25,36,.60);

  color:var(--cyan);

  font-size:9px;

  letter-spacing:.18em;

  cursor:pointer;

  transition:.2s;
}

.voice-button.active{
  border-color:
    rgba(141,232,255,.62);

  box-shadow:
    0 0 14px
    rgba(141,232,255,.10);
}

.voice-button:disabled{
  opacity:.40;
}


/* =========================================================
   VERSION
========================================================= */

.version{
  position:absolute;

  left:14px;
  bottom:52px;

  z-index:20;

  color:
    rgba(141,232,255,.28);

  font-size:8px;

  letter-spacing:.14em;

  pointer-events:none;

  user-select:none;
}


/* =========================================================
   METRICS
========================================================= */

.bottom{
  position:absolute;

  left:14px;
  right:14px;
  bottom:12px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}

.metric{
  padding-top:7px;

  text-align:center;

  border-top:
    1px solid
    rgba(141,232,255,.13);
}

.metric b{
  display:block;

  font-size:12px;

  font-weight:500;
}

.metric span{
  color:var(--muted);

  font-size:8px;

  letter-spacing:.13em;
}

.stale{
  opacity:.50;
}


/* =========================================================
   ANIMATIONS
========================================================= */

<script type="module">


/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://hibrzsnwkbngaaujdvxl.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_yJBOE5AnX7-N8EkV98LNnA_LJ0KEz-P";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const el =
  id =>
    document.getElementById(id);



/* =========================================================
   STATE
========================================================= */

let refreshTimer =
  null;


let peerConnection =
  null;


let dataChannel =
  null;


let localStream =
  null;


let remoteAudio =
  null;


let voicePhase =
  "disconnected";


let baseStatus =
  "SYSTEM INTEGRITY 100%";


let baseMessage =
  "Standing by, sir.";


let modelResponding =
  false;


let lastAudibleTime =
  0;



/* =========================================================
   AUDIO ANALYSIS
========================================================= */

let audioContext =
  null;


let remoteAnalyser =
  null;


let remoteSource =
  null;


let audioTimeData =
  null;


let audioFreqData =
  null;


let animationFrame =
  null;


let smoothLevel =
  0;



async function setupAudioVisuals(
  stream
){

  resetAudioVisuals();


  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if(
    !AudioContextClass
  ){

    return;
  }


  audioContext =
    new AudioContextClass();


  if(
    audioContext.state ===
    "suspended"
  ){

    await audioContext.resume();
  }


  remoteAnalyser =
    audioContext.createAnalyser();


  remoteAnalyser.fftSize =
    512;


  remoteAnalyser.smoothingTimeConstant =
    .72;


  audioTimeData =
    new Uint8Array(
      remoteAnalyser.fftSize
    );


  audioFreqData =
    new Uint8Array(
      remoteAnalyser.frequencyBinCount
    );


  remoteSource =
    audioContext.createMediaStreamSource(
      stream
    );


  remoteSource.connect(
    remoteAnalyser
  );


  animateAudio();
}



/* =========================================================
   RADIAL AUDIO
========================================================= */

function drawRadialSpectrum(
  frequencies,
  level
){

  const canvas =
    el(
      "audioSpectrum"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const w =
    canvas.width;


  const h =
    canvas.height;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  if(
    voicePhase !==
    "speaking"
  ){

    return;
  }


  const cx =
    w / 2;


  const cy =
    h / 2;


  const bars =
    72;


  const baseRadius =
    205;


  const usefulBins =
    Math.min(
      105,
      frequencies.length
    );


  for(
    let i = 0;
    i < bars;
    i++
  ){

    const ratio =
      i /
      bars;


    const angle =
      ratio *
      Math.PI *
      2
      -
      Math.PI /
      2;


    const mirrorRatio =
      ratio <= .5
        ?
        ratio * 2
        :
        (
          1 -
          ratio
        ) * 2;


    const freqIndex =
      Math.floor(
        mirrorRatio *
        (
          usefulBins -
          1
        )
      );


    const frequencyStrength =
      frequencies[
        freqIndex
      ] /
      255;


    let strength =
      frequencyStrength *
      .82
      +
      level *
      .28;


    strength =
      Math.min(
        1,
        strength
      );


    const vertical =
      (
        Math.sin(
          angle
        ) +
        1
      ) /
      2;


    const depth =
      .66 +
      vertical *
      .34;


    const length =
      (
        7 +
        strength *
        48
      ) *
      depth;


    const radius =
      baseRadius +
      vertical *
      5;


    const x1 =
      cx +
      Math.cos(
        angle
      ) *
      radius;


    const y1 =
      cy +
      Math.sin(
        angle
      ) *
      radius;


    const x2 =
      cx +
      Math.cos(
        angle
      ) *
      (
        radius +
        length
      );


    const y2 =
      cy +
      Math.sin(
        angle
      ) *
      (
        radius +
        length
      );


    const alpha =
      (
        .18 +
        strength *
        .66
      ) *
      depth;



    /* glow */

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.strokeStyle =
      `rgba(
        94,
        201,
        238,
        ${
          alpha *
          .28
        }
      )`;

    ctx.lineWidth =
      5.5;

    ctx.lineCap =
      "round";

    ctx.shadowColor =
      "rgba(141,232,255,.42)";

    ctx.shadowBlur =
      13;

    ctx.stroke();



    /* sharp bar */

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.strokeStyle =
      `rgba(
        160,
        240,
        255,
        ${alpha}
      )`;

    ctx.lineWidth =
      1.8 +
      strength *
      .7;

    ctx.lineCap =
      "round";

    ctx.shadowColor =
      "rgba(141,232,255,.62)";

    ctx.shadowBlur =
      strength *
      7;

    ctx.stroke();



    /* tip spark */

    if(
      strength >
      .42
    ){

      ctx.beginPath();

      ctx.arc(
        x2,
        y2,
        .8 +
        strength *
        .8,
        0,
        Math.PI *
        2
      );

      ctx.fillStyle =
        `rgba(
          190,
          246,
          255,
          ${
            alpha *
            .85
          }
        )`;

      ctx.shadowBlur =
        7;

      ctx.fill();
    }
  }


  ctx.shadowBlur =
    0;
}



/* =========================================================
   AUDIO LOOP
========================================================= */

function animateAudio(){

  if(
    !remoteAnalyser ||
    !audioTimeData ||
    !audioFreqData
  ){

    return;
  }


  remoteAnalyser.getByteTimeDomainData(
    audioTimeData
  );


  remoteAnalyser.getByteFrequencyData(
    audioFreqData
  );


  let sum =
    0;


  for(
    let i = 0;
    i < audioTimeData.length;
    i++
  ){

    const n =
      (
        audioTimeData[i] -
        128
      ) /
      128;


    sum +=
      n *
      n;
  }


  const rms =
    Math.sqrt(
      sum /
      audioTimeData.length
    );


  let level =
    (
      rms -
      .004
    ) *
    14;


  level =
    Math.max(
      0,
      Math.min(
        1,
        level
      )
    );


  smoothLevel =
    smoothLevel *
      .67
    +
    level *
      .33;


  const v =
    smoothLevel;



  /* -----------------------------------------
     REAL AUDIO CONTROLS SPEAKING
  ----------------------------------------- */

  if(
    v >
    .035
  ){

    lastAudibleTime =
      performance.now();


    if(
      voicePhase !==
      "speaking"
    ){

      setVoicePhase(
        "speaking"
      );
    }

  } else {

    const silenceTime =
      performance.now() -
      lastAudibleTime;


    if(
      voicePhase ===
      "speaking"
      &&
      silenceTime >
      520
    ){

      if(
        modelResponding
      ){

        setVoicePhase(
          "analysing"
        );

      } else {

        setVoicePhase(
          "listening"
        );
      }
    }
  }



  /* subtle circles */

  animateWave(
    "wave1",
    1 +
      v *
      .11,
    .03 +
      v *
      .08
  );


  animateWave(
    "wave2",
    1 +
      v *
      .16,
    .018 +
      v *
      .045
  );



  /* core lens */

  el(
    "coreDot"
  )
  .style.transform =
    `
      translateZ(70px)
      scale(${
        1 +
        v *
        .12
      })
    `;


  el(
    "coreHalo"
  )
  .style.transform =
    `
      translateZ(44px)
      scale(${
        1 +
        v *
        .085
      })
    `;



  /*
    Slight 3D motion with actual voice level.
  */

  if(
    voicePhase ===
    "speaking"
  ){

    const sway =
      Math.sin(
        performance.now() /
        430
      ) *
      .45;


    el(
      "core"
    )
    .style.transform =
      `
        rotateX(${
          4 +
          v *
          2.2
        }deg)

        rotateY(${
          -4 -
          v *
          2.1 +
          sway
        }deg)

        translateY(${
          -v *
          2
        }px)

        scale(${
          1.01 +
          v *
          .014
        })
      `;
  }



  drawRadialSpectrum(
    audioFreqData,
    v
  );


  animationFrame =
    requestAnimationFrame(
      animateAudio
    );
}



function animateWave(
  id,
  scale,
  opacity
){

  const node =
    el(id);


  if(
    !node
  ){

    return;
  }


  node.style.transform =
    `scale(${scale})`;


  node.style.opacity =
    opacity;
}



/* =========================================================
   RESET AUDIO
========================================================= */

function resetAudioVisuals(){

  if(
    animationFrame
  ){

    cancelAnimationFrame(
      animationFrame
    );


    animationFrame =
      null;
  }


  smoothLevel =
    0;


  lastAudibleTime =
    0;


  const canvas =
    el(
      "audioSpectrum"
    );


  if(
    canvas
  ){

    canvas
      .getContext(
        "2d"
      )
      .clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );
  }


  if(
    el(
      "wave1"
    )
  ){

    el(
      "wave1"
    )
    .style.transform =
      "scale(1)";
  }


  if(
    el(
      "wave2"
    )
  ){

    el(
      "wave2"
    )
    .style.transform =
      "scale(1)";
  }


  if(
    el(
      "core"
    )
  ){

    el(
      "core"
    )
    .style.transform =
      "";
  }


  remoteAnalyser =
    null;


  remoteSource =
    null;


  audioTimeData =
    null;


  audioFreqData =
    null;


  if(
    audioContext
  ){

    try{

      audioContext.close();

    } catch{}


    audioContext =
      null;
  }
}



/* =========================================================
   HOME DATA
========================================================= */

function fmtKw(
  value
){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(
      Number(value)
    )
  ){

    return "-- kW";
  }


  return `${
    (
      Number(value) /
      1000
    )
    .toFixed(2)
  } kW`;
}



function restoreBaseStatus(){

  if(
    voicePhase !==
    "disconnected"
  ){

    return;
  }


  el(
    "status"
  )
  .textContent =
    baseStatus;


  el(
    "message"
  )
  .textContent =
    baseMessage;
}



async function loadData(){

  try{

    const {
      data,
      error
    } =
      await supabase
        .from(
          "jarvis_status"
        )
        .select(
          "id,temperature,solar,bmw,grid,updated_at"
        )
        .eq(
          "id",
          1
        )
        .single();


    if(
      error
    ){

      throw error;
    }


    el(
      "temp"
    )
    .textContent =
      data.temperature == null
        ?
        "--.-°C"
        :
        `${
          Number(
            data.temperature
          )
          .toFixed(1)
        }°C`;


    el(
      "solar"
    )
    .textContent =
      fmtKw(
        data.solar
      );


    el(
      "bmw"
    )
    .textContent =
      data.bmw == null
        ?
        "--%"
        :
        `${
          Math.round(
            Number(
              data.bmw
            )
          )
        }%`;


    el(
      "grid"
    )
    .textContent =
      fmtKw(
        data.grid
      );


    const updated =
      data.updated_at
        ?
        new Date(
          data.updated_at
        )
        :
        null;


    const age =
      updated
        ?
        (
          Date.now() -
          updated.getTime()
        ) /
        1000
        :
        999999;


    if(
      age >
      180
    ){

      baseStatus =
        "DATA LINK STALE";


      baseMessage =
        "Home data has not been updated recently, sir.";


      document
        .querySelector(
          ".bottom"
        )
        .classList
        .add(
          "stale"
        );

    } else {

      baseStatus =
        "SYSTEM INTEGRITY 100%";


      baseMessage =
        "Standing by, sir.";


      document
        .querySelector(
          ".bottom"
        )
        .classList
        .remove(
          "stale"
        );
    }


    el(
      "linkState"
    )
    .textContent =
      "ONLINE";


    restoreBaseStatus();

  } catch(error){

    console.error(
      error
    );


    baseStatus =
      "DATA LINK DEGRADED";


    baseMessage =
      "I appear to have misplaced Homey, sir.";


    el(
      "linkState"
    )
    .textContent =
      "LINK DEGRADED";


    restoreBaseStatus();
  }
}

      );

/* =========================================================
   VISUAL STATES
========================================================= */

function setVisualState(
  state
){

  const panel =
    el(
      "panel"
    );


  panel.classList.remove(
    "standby",
    "listening",
    "analysing",
    "speaking"
  );


  panel.classList.add(
    state
  );


  if(
    state !==
    "speaking"
  ){

    el(
      "core"
    )
    .style.transform =
      "";
  }
}



function setVoicePhase(
  phase
){

  voicePhase =
    phase;


  if(
    phase ===
    "connecting"
  ){

    setVisualState(
      "analysing"
    );


    el(
      "status"
    )
    .textContent =
      "ESTABLISHING VOICE LINK";


    el(
      "message"
    )
    .textContent =
      "Securing realtime channel...";
  }


  if(
    phase ===
    "listening"
  ){

    setVisualState(
      "listening"
    );


    el(
      "status"
    )
    .textContent =
      "LISTENING";


    el(
      "message"
    )
    .textContent =
      "Voice link active.";
  }


  if(
    phase ===
    "analysing"
  ){

    setVisualState(
      "analysing"
    );


    el(
      "status"
    )
    .textContent =
      "ANALYSING";


    el(
      "message"
    )
    .textContent =
      "Processing...";
  }


  if(
    phase ===
    "speaking"
  ){

    setVisualState(
      "speaking"
    );


    el(
      "status"
    )
    .textContent =
      "SPEAKING";


    el(
      "message"
    )
    .textContent =
      "JARVIS voice channel active.";
  }


  if(
    phase ===
    "disconnected"
  ){

    setVisualState(
      "standby"
    );


    restoreBaseStatus();
  }
}



/* =========================================================
   REALTIME EVENTS
========================================================= */

function handleRealtimeEvent(
  event
){

  const type =
    event?.type ||
    "";


  if(
    type ===
    "input_audio_buffer.speech_started"
  ){

    modelResponding =
      false;


    setVoicePhase(
      "listening"
    );


    return;
  }


  if(
    type ===
    "input_audio_buffer.speech_stopped"
  ){

    setVoicePhase(
      "analysing"
    );


    return;
  }


  if(
    type ===
    "response.created"
  ){

    modelResponding =
      true;


    setVoicePhase(
      "analysing"
    );


    return;
  }


  if(
    type ===
    "response.output_audio.delta"
    ||
    (
      type.includes(
        "output_audio"
      )
      &&
      type.includes(
        "delta"
      )
    )
  ){

    setVoicePhase(
      "speaking"
    );


    return;
  }


  if(
    type ===
    "response.done"
    ||
    type ===
    "response.completed"
  ){

    modelResponding =
      false;


    return;
  }


  if(
    type ===
    "error"
  ){

    modelResponding =
      false;


    console.error(
      event
    );


    el(
      "status"
    )
    .textContent =
      "VOICE LINK ERROR";


    el(
      "message"
    )
    .textContent =
      event?.error?.message
      ||
      "Realtime channel reported an error.";
  }
}



/* =========================================================
   START VOICE
========================================================= */

async function startVoice(){

  if(
    peerConnection
  ){

    return;
  }


  const button =
    el(
      "voiceButton"
    );


  button.disabled =
    true;


  button.textContent =
    "CONNECTING...";


  setVoicePhase(
    "connecting"
  );


  try{


    if(
      !navigator
        .mediaDevices
        ?.getUserMedia
    ){

      throw new Error(
        "Microphone access is unavailable in this browser."
      );
    }



    const {
      data:tokenData,
      error:tokenError
    } =
      await supabase
        .functions
        .invoke(
          "jarvis-realtime",
          {
            body:{}
          }
        );


    if(
      tokenError
    ){

      throw tokenError;
    }


    const key =
      tokenData?.value;


    if(
      !key
    ){

      throw new Error(
        "No ephemeral realtime key returned."
      );
    }



    const pc =
      new RTCPeerConnection();


    peerConnection =
      pc;



    const audio =
      document.createElement(
        "audio"
      );


    audio.autoplay =
      true;


    audio.playsInline =
      true;


    audio.style.display =
      "none";


    document.body
      .appendChild(
        audio
      );


    remoteAudio =
      audio;


    pc.ontrack =
      event => {

        const stream =
          event.streams[0];


        audio.srcObject =
          stream;


        setupAudioVisuals(
          stream
        );


        audio.play()
          .catch(
            error =>
              console.warn(
                "Audio playback:",
                error
              )
          );
      };



    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:{

            echoCancellation:true,

            noiseSuppression:true,

            autoGainControl:true

          }

        });


    localStream =
      stream;


    const track =
      stream
        .getAudioTracks()[0];


    if(
      !track
    ){

      throw new Error(
        "No microphone audio track available."
      );
    }


    pc.addTrack(
      track,
      stream
    );



    const dc =
      pc.createDataChannel(
        "oai-events"
      );


    dataChannel =
      dc;


    dc.addEventListener(
      "open",
      () => {

        button.disabled =
          false;


        button.textContent =
          "DISCONNECT VOICE";


        button
          .classList
          .add(
            "active"
          );


        setVoicePhase(
          "listening"
        );
      }
    );


    dc.addEventListener(
      "message",
      event => {

        try{

          const message =
            JSON.parse(
              event.data
            );


          handleRealtimeEvent(
            message
          );

        } catch(error){

          console.warn(
            error
          );
        }
      }
    );



    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );



    const response =
      await fetch(
        "https://api.openai.com/v1/realtime/calls",
        {

          method:
            "POST",

          body:
            offer.sdp,

          headers:{

            "Authorization":
              `Bearer ${key}`,

            "Content-Type":
              "application/sdp"

          }

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        await response.text()
      );
    }


    await pc.setRemoteDescription({

      type:
        "answer",

      sdp:
        await response.text()

    });



    pc.addEventListener(
      "connectionstatechange",
      () => {

        if(
          peerConnection !==
          pc
        ){

          return;
        }


        if(
          pc.connectionState ===
          "failed"
          ||
          pc.connectionState ===
          "closed"
        ){

          stopVoice();
        }
      }
    );


  } catch(error){

    console.error(
      error
    );


    stopVoice(
      false
    );


    el(
      "status"
    )
    .textContent =
      "VOICE LINK FAILED";


    if(
      error?.name ===
      "NotAllowedError"
    ){

      el(
        "message"
      )
      .textContent =
        "Microphone permission was denied.";

    } else {

      el(
        "message"
      )
      .textContent =
        error?.message
        ||
        "Realtime connection failed.";
    }


    button.disabled =
      false;


    button.textContent =
      "RETRY VOICE";
  }
}



/* =========================================================
   STOP
========================================================= */

function stopVoice(
  updateUi = true
){

  const pc =
    peerConnection;


  const dc =
    dataChannel;


  peerConnection =
    null;


  dataChannel =
    null;


  modelResponding =
    false;


  resetAudioVisuals();



  if(
    localStream
  ){

    for(
      const track
      of localStream.getTracks()
    ){

      track.stop();
    }


    localStream =
      null;
  }



  if(
    remoteAudio
  ){

    try{

      remoteAudio.pause();


      remoteAudio.srcObject =
        null;


      remoteAudio.remove();

    } catch{}


    remoteAudio =
      null;
  }



  try{

    dc?.close();

  } catch{}



  try{

    pc?.close();

  } catch{}



  voicePhase =
    "disconnected";


  const button =
    el(
      "voiceButton"
    );


  button.disabled =
    false;


  button.textContent =
    "ACTIVATE VOICE";


  button.classList.remove(
    "active"
  );


  setVisualState(
    "standby"
  );


  if(
    updateUi
  ){

    restoreBaseStatus();
  }
}



/* =========================================================
   BUTTON
========================================================= */

el(
  "voiceButton"
)
.addEventListener(
  "click",
  async () => {

    if(
      peerConnection
    ){

      stopVoice();

    } else {

      await startVoice();
    }
  }
);



/* =========================================================
   LOGIN
========================================================= */

el(
  "loginForm"
)
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      el(
        "email"
      )
      .value
      .trim();


    const password =
      el(
        "password"
      )
      .value;


    const button =
      el(
        "loginButton"
      );


    el(
      "authError"
    )
    .textContent =
      "";


    button.disabled =
      true;


    button.textContent =
      "AUTHENTICATING...";


    const {
      error
    } =
      await supabase
        .auth
        .signInWithPassword({

          email,

          password

        });


    button.disabled =
      false;


    button.textContent =
      "AUTHENTICATE";


    if(
      error
    ){

      el(
        "authError"
      )
      .textContent =
        "ACCESS DENIED";


      return;
    }


    el(
      "password"
    )
    .value =
      "";


    showDashboard();
  }
);



/* =========================================================
   LOGOUT
========================================================= */

el(
  "logoutButton"
)
.addEventListener(
  "click",
  async () => {

    stopVoice(
      false
    );


    await supabase
      .auth
      .signOut({

        scope:
          "local"

      });


    showLogin();
  }
);



/* =========================================================
   SESSION
========================================================= */

const {

  data:{
    session
  }

} =
  await supabase.auth.getSession();


if(
  session
){

  showDashboard();

} else {

  showLogin();
}



supabase
  .auth
  .onAuthStateChange(
    (
      event,
      session
    ) => {

      if(
        event ===
        "SIGNED_OUT"
      ){

        showLogin();
      }


      if(
        event ===
        "SIGNED_IN"
        &&
        session
      ){

        showDashboard();
      }
    }
  );

</script>
