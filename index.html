<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>J.A.R.V.I.S.</title>

<style>

:root{
  --bg:#02070c;
  --bg2:#071018;
  --text:#eaf8ff;
  --muted:#78919d;
  --glow:#8de8ff;
  --glow2:#5ec9ee;
  --danger:#ff8f8f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #071018,
      #02070c
    );

  color:var(--text);

  font-family:
    Inter,
    Arial,
    sans-serif;
}

body{
  display:flex;
}


/* =========================================================
   LOGIN
========================================================= */

.auth-gate{

  position:fixed;
  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:24px;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(65,182,222,.12),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      #08121c,
      #03090e
    );
}


.auth-card{

  width:min(360px,100%);

  padding:32px 28px;

  text-align:center;

  border-radius:14px;

  border:
    1px solid
    rgba(141,232,255,.18);

  background:
    rgba(5,15,23,.92);

  box-shadow:
    0 0 60px
      rgba(95,210,255,.05),
    inset 0 0 35px
      rgba(95,210,255,.025);
}


.auth-core{

  width:76px;
  height:76px;

  margin:
    0 auto 24px;

  position:relative;

  border-radius:50%;

  border:
    1px solid
    rgba(141,232,255,.60);

  box-shadow:
    0 0 22px
    rgba(141,232,255,.20);
}


.auth-core:before,
.auth-core:after{

  content:"";

  position:absolute;

  border-radius:50%;

  border:
    1px dashed
    rgba(141,232,255,.25);
}


.auth-core:before{
  inset:10px;
}


.auth-core:after{
  inset:25px;
}


.auth-title{

  margin-bottom:7px;

  font-size:16px;

  letter-spacing:.32em;

  padding-left:.32em;
}


.auth-subtitle{

  margin-bottom:25px;

  color:var(--muted);

  font-size:10px;

  letter-spacing:.18em;
}


.auth-card input{

  width:100%;

  margin-bottom:11px;

  padding:12px 13px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.18);

  outline:none;

  background:
    rgba(3,10,16,.92);

  color:var(--text);

  font-size:14px;
}


.auth-card input:focus{

  border-color:
    rgba(141,232,255,.60);

  box-shadow:
    0 0 12px
    rgba(141,232,255,.08);
}


.auth-card button{

  width:100%;

  padding:12px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.42);

  background:
    rgba(10,32,45,.72);

  color:var(--text);

  font-size:11px;

  letter-spacing:.16em;

  cursor:pointer;
}


.auth-error{

  min-height:18px;

  margin-top:13px;

  color:var(--danger);

  font-size:10px;
}


/* =========================================================
   MAIN PANEL
========================================================= */

.panel{

  display:none;

  width:100%;
  height:100%;

  position:relative;

  overflow:hidden;

  perspective:900px;

  background:
    radial-gradient(
      ellipse at 50% 43%,
      rgba(63,160,198,.09),
      transparent 28%
    ),
    linear-gradient(
      180deg,
      #07111a,
      #020609
    );

  transition:
    background .35s ease;
}


/* =========================================================
   BACKGROUND DEPTH
========================================================= */

.scene-glow{

  position:absolute;

  left:50%;
  top:47%;

  width:440px;
  height:440px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(141,232,255,.055),
      rgba(141,232,255,.018) 38%,
      transparent 69%
    );

  filter:
    blur(44px);

  opacity:.18;

  transition:
    opacity .25s,
    transform .25s;
}


.depth-shadow{

  position:absolute;

  left:50%;
  top:57%;

  width:230px;
  height:58px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.65),
      rgba(0,0,0,.18) 45%,
      transparent 72%
    );

  filter:
    blur(16px);

  opacity:.75;

  pointer-events:none;
}


/* =========================================================
   TOP BAR
========================================================= */

.top{

  position:relative;

  z-index:20;

  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:
    15px 18px 4px;

  color:var(--muted);

  font-size:12px;

  letter-spacing:.18em;
}


.online{

  display:flex;

  align-items:center;

  gap:7px;
}


.dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--glow);

  box-shadow:
    0 0 10px
    var(--glow);
}


.logout{

  margin-left:10px;

  border:0;

  background:none;

  color:var(--muted);

  font-size:8px;

  letter-spacing:.12em;

  cursor:pointer;

  opacity:.60;
}


.logout:hover{

  opacity:1;

  color:var(--text);
}


/* =========================================================
   CENTRE
========================================================= */

.centre{

  position:absolute;

  left:50%;
  top:48%;

  transform:
    translate(-50%,-50%);

  width:min(
    98%,
    720px
  );

  text-align:center;
}


/* =========================================================
   CORE AREA
========================================================= */

.core-stage{

  width:100%;

  height:320px;

  position:relative;

  display:flex;

  align-items:center;
  justify-content:center;

  transform-style:
    preserve-3d;
}


/* =========================================================
   HORIZONTAL AUDIO WAVE
========================================================= */

.waveform-line{

  position:absolute;

  left:50%;
  top:50%;

  width:min(
    94vw,
    670px
  );

  height:150px;

  transform:
    translate(-50%,-50%);

  opacity:0;

  pointer-events:none;

  z-index:3;

  transition:
    opacity .15s ease;
}


/* =========================================================
   3D CORE
========================================================= */

.core{

  position:relative;

  width:230px;
  height:230px;

  z-index:10;

  display:flex;

  align-items:center;
  justify-content:center;

  transform-style:
    preserve-3d;

  transform:
    rotateX(4deg)
    rotateY(-3deg);

  transition:
    transform .18s ease,
    filter .20s ease;
}


/* ---------------------------------------------------------
   SPHERICAL BODY
--------------------------------------------------------- */

.sphere-shell{

  position:absolute;

  inset:31px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 38% 28%,
      rgba(210,248,255,.11),
      rgba(115,215,245,.045) 20%,
      rgba(28,77,104,.04) 48%,
      rgba(0,0,0,.24) 72%,
      transparent 75%
    );

  box-shadow:
    inset -14px -18px 30px
      rgba(0,0,0,.32),
    inset 10px 8px 20px
      rgba(141,232,255,.035),
    0 0 18px
      rgba(141,232,255,.045);

  pointer-events:none;
}


/* ---------------------------------------------------------
   3D ORBIT RINGS
--------------------------------------------------------- */

.orbit{

  position:absolute;

  left:50%;
  top:50%;

  border-radius:50%;

  pointer-events:none;

  transform-style:
    preserve-3d;
}


.orbit-a{

  width:224px;
  height:224px;

  border:
    1px solid
    rgba(141,232,255,.30);

  transform:
    translate(-50%,-50%)
    rotateX(64deg);

  animation:
    orbitA
    19s linear infinite;
}


.orbit-b{

  width:204px;
  height:204px;

  border:
    1px dashed
    rgba(141,232,255,.20);

  transform:
    translate(-50%,-50%)
    rotateY(67deg);

  animation:
    orbitB
    24s linear infinite;
}


.orbit-c{

  width:196px;
  height:196px;

  border:
    1px solid
    rgba(141,232,255,.14);

  transform:
    translate(-50%,-50%)
    rotateX(38deg)
    rotateY(48deg);

  animation:
    orbitC
    30s linear infinite;
}


/* ---------------------------------------------------------
   HORIZONTAL HOLOGRAM DISCS
--------------------------------------------------------- */

.floor-ring,
.floor-ring2{

  position:absolute;

  left:50%;

  border-radius:50%;

  pointer-events:none;

  transform-style:
    preserve-3d;
}


.floor-ring{

  width:310px;
  height:100px;

  bottom:0;

  transform:
    translateX(-50%)
    perspective(650px)
    rotateX(76deg);

  border:
    1px solid
    rgba(141,232,255,.10);

  box-shadow:
    0 0 16px
    rgba(141,232,255,.05);

  opacity:.42;
}


.floor-ring2{

  width:218px;
  height:65px;

  bottom:17px;

  transform:
    translateX(-50%)
    perspective(650px)
    rotateX(76deg);

  border:
    1px dashed
    rgba(141,232,255,.10);

  opacity:.28;
}


/* ---------------------------------------------------------
   FRONT / BACK RINGS
--------------------------------------------------------- */

.main-ring,
.inner-ring,
.scan-ring,
.arc-ring,
.thinking-ring{

  position:absolute;

  border-radius:50%;

  pointer-events:none;
}


.main-ring{

  inset:32px;

  border:
    1px solid
    rgba(141,232,255,.36);

  animation:
    rotateClockwise
    19s linear infinite;

  transform:
    translateZ(15px);
}


.main-ring:before,
.main-ring:after{

  content:"";

  position:absolute;

  border-radius:50%;

  background:
    var(--glow);

  box-shadow:
    0 0 8px
    rgba(141,232,255,.72);
}


.main-ring:before{

  width:5px;
  height:5px;

  left:15px;
  top:28px;
}


.main-ring:after{

  width:3px;
  height:3px;

  right:22px;
  bottom:28px;
}


.inner-ring{

  inset:51px;

  border:
    1px dashed
    rgba(141,232,255,.23);

  opacity:.56;

  animation:
    rotateCounter
    25s linear infinite;

  transform:
    translateZ(25px);
}


.scan-ring{

  inset:17px;

  border:
    1px solid
    transparent;

  border-top-color:
    rgba(141,232,255,.18);

  border-right-color:
    rgba(141,232,255,.035);

  opacity:.20;

  animation:
    rotateClockwise
    32s linear infinite;
}


.arc-ring{

  inset:71px;

  border:
    2px solid
    transparent;

  border-top-color:
    rgba(141,232,255,.27);

  border-left-color:
    rgba(141,232,255,.08);

  opacity:.58;

  animation:
    rotateCounter
    9s linear infinite;

  transform:
    translateZ(35px);
}


/* ---------------------------------------------------------
   THINKING SEGMENTS
--------------------------------------------------------- */

.thinking-ring{

  inset:4px;

  opacity:0;

  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(141,232,255,.42) 0deg 2deg,
      transparent 2deg 12deg
    );

  mask:
    radial-gradient(
      circle,
      transparent 64%,
      #000 65% 68%,
      transparent 69%
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 64%,
      #000 65% 68%,
      transparent 69%
    );

  transition:
    opacity .20s;
}


/* ---------------------------------------------------------
   SUBTLE SPEECH RINGS
--------------------------------------------------------- */

.voice-wave{

  position:absolute;

  border-radius:50%;

  pointer-events:none;

  transition:
    transform .08s linear,
    opacity .08s linear,
    box-shadow .08s linear;
}


.wave1{

  inset:32px;

  border:
    1px solid
    rgba(141,232,255,.11);

  opacity:.05;
}


.wave2{

  inset:10px;

  border:
    1px solid
    rgba(141,232,255,.07);

  opacity:.025;
}


/* ---------------------------------------------------------
   LENS / CORE
--------------------------------------------------------- */

.core-halo{

  position:absolute;

  inset:67px;

  border-radius:50%;

  border:
    1px solid
    rgba(141,232,255,.22);

  box-shadow:
    0 0 13px
      rgba(141,232,255,.08),
    inset 0 0 14px
      rgba(141,232,255,.06);

  transform:
    translateZ(42px);

  transition:
    transform .08s,
    box-shadow .08s;
}


.inner-lens{

  position:absolute;

  inset:82px;

  border-radius:50%;

  transform:
    translateZ(48px);

  background:
    radial-gradient(
      circle at 40% 35%,
      rgba(209,249,255,.17),
      rgba(141,232,255,.07) 25%,
      rgba(39,104,135,.04) 55%,
      transparent 75%
    );

  box-shadow:
    inset -6px -7px 12px
      rgba(0,0,0,.25);
}


.core-dot{

  position:relative;

  z-index:30;

  width:32px;
  height:32px;

  border-radius:50%;

  transform:
    translateZ(65px);

  border:
    1px solid
    rgba(141,232,255,.96);

  background:
    radial-gradient(
      circle at 38% 32%,
      rgba(230,252,255,.22),
      rgba(141,232,255,.10) 30%,
      rgba(141,232,255,.025) 68%
    );

  box-shadow:
    0 0 18px
      rgba(141,232,255,.42),
    inset -5px -6px 9px
      rgba(0,0,0,.22),
    inset 3px 3px 8px
      rgba(255,255,255,.06);

  transition:
    transform .08s,
    box-shadow .08s;
}


/* =========================================================
   STATES
========================================================= */


/* STANDBY */

.panel.standby .scene-glow{
  opacity:.13;
}


.panel.standby .core{
  transform:
    rotateX(4deg)
    rotateY(-3deg);
}


.panel.standby .orbit-a{
  opacity:.28;
}


.panel.standby .orbit-b{
  opacity:.20;
}


.panel.standby .orbit-c{
  opacity:.14;
}


.panel.standby .core-dot{

  animation:
    standbyBreath
    4s ease-in-out infinite;
}


/* LISTENING */

.panel.listening .scene-glow{
  opacity:.21;
}


.panel.listening .core{

  transform:
    rotateX(2deg)
    rotateY(-2deg)
    scale(1.015);
}


.panel.listening .orbit-a{
  opacity:.48;
}


.panel.listening .orbit-b{
  opacity:.36;
}


.panel.listening .orbit-c{
  opacity:.26;
}


.panel.listening .core-halo{

  animation:
    listeningBreath
    1.4s ease-in-out infinite;
}


/* ANALYSING */

.panel.analysing{

  background:
    radial-gradient(
      ellipse at 50% 43%,
      rgba(57,142,178,.065),
      transparent 25%
    ),
    linear-gradient(
      180deg,
      #040b10,
      #010406
    );
}


.panel.analysing .scene-glow{
  opacity:.13;
}


.panel.analysing .thinking-ring{

  opacity:.58;

  animation:
    rotateClockwise
    2.0s linear infinite;
}


.panel.analysing .main-ring{

  animation-duration:
    2.1s;

  opacity:.58;
}


.panel.analysing .inner-ring{

  animation-duration:
    3s;

  opacity:.68;
}


.panel.analysing .scan-ring{

  animation-duration:
    1.25s;

  opacity:.75;
}


.panel.analysing .orbit-a{

  animation-duration:
    5.5s;

  opacity:.50;
}


.panel.analysing .orbit-b{

  animation-duration:
    7s;

  opacity:.36;
}


.panel.analysing .orbit-c{

  animation-duration:
    8s;

  opacity:.28;
}


.panel.analysing .core{

  transform:
    rotateX(10deg)
    rotateY(8deg)
    scale(.985);
}


.panel.analysing .core-dot{

  animation:
    thinkingPulse
    .8s ease-in-out infinite;
}


/* SPEAKING */

.panel.speaking .scene-glow{
  opacity:.24;
}


.panel.speaking .waveform-line{
  opacity:.98;
}


.panel.speaking .core{

  transform:
    rotateX(3deg)
    rotateY(-4deg)
    scale(1.015);

  filter:
    drop-shadow(
      0 0 9px
      rgba(141,232,255,.09)
    );
}


.panel.speaking .orbit-a{
  opacity:.42;
}


.panel.speaking .orbit-b{
  opacity:.31;
}


.panel.speaking .orbit-c{
  opacity:.22;
}


.panel.speaking .main-ring{
  opacity:.72;
}


.panel.speaking .inner-ring{
  opacity:.48;
}


.panel.speaking .voice-wave{
  opacity:.10;
}


.panel.speaking .core-dot{

  box-shadow:
    0 0 26px
      rgba(141,232,255,.70),
    inset -5px -6px 9px
      rgba(0,0,0,.20),
    inset 3px 3px 8px
      rgba(255,255,255,.08);
}


/* =========================================================
   TEXT
========================================================= */

h1{

  margin:
    7px 0 7px;

  padding-left:.32em;

  font-size:15px;

  letter-spacing:.32em;

  font-weight:600;
}


.status{

  min-height:16px;

  color:var(--glow);

  font-size:11px;

  letter-spacing:.20em;
}


.message{

  min-height:16px;

  margin-top:8px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   BUTTON
========================================================= */

.voice-button{

  margin-top:18px;

  padding:
    9px 18px;

  border-radius:8px;

  border:
    1px solid
    rgba(141,232,255,.26);

  background:
    rgba(8,25,36,.60);

  color:var(--glow);

  font-size:9px;

  letter-spacing:.18em;

  cursor:pointer;

  transition:.2s;
}


.voice-button.active{

  border-color:
    rgba(141,232,255,.62);

  box-shadow:
    0 0 14px
    rgba(141,232,255,.10);
}


.voice-button:disabled{
  opacity:.40;
}


/* =========================================================
   DATA
========================================================= */

.bottom{

  position:absolute;

  left:14px;
  right:14px;
  bottom:12px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}


.metric{

  padding-top:7px;

  text-align:center;

  border-top:
    1px solid
    rgba(141,232,255,.13);
}


.metric b{

  display:block;

  font-size:12px;

  font-weight:500;
}


.metric span{

  color:var(--muted);

  font-size:8px;

  letter-spacing:.13em;
}


.stale{
  opacity:.50;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes rotateClockwise{

  to{
    transform:
      rotate(360deg);
  }
}


@keyframes rotateCounter{

  to{
    transform:
      rotate(-360deg);
  }
}


@keyframes orbitA{

  from{
    transform:
      translate(-50%,-50%)
      rotateX(64deg)
      rotateZ(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotateX(64deg)
      rotateZ(360deg);
  }
}


@keyframes orbitB{

  from{
    transform:
      translate(-50%,-50%)
      rotateY(67deg)
      rotateZ(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotateY(67deg)
      rotateZ(-360deg);
  }
}


@keyframes orbitC{

  from{
    transform:
      translate(-50%,-50%)
      rotateX(38deg)
      rotateY(48deg)
      rotateZ(0deg);
  }

  to{
    transform:
      translate(-50%,-50%)
      rotateX(38deg)
      rotateY(48deg)
      rotateZ(360deg);
  }
}


@keyframes standbyBreath{

  50%{
    transform:
      translateZ(65px)
      scale(1.04);

    opacity:.88;
  }
}


@keyframes listeningBreath{

  50%{
    transform:
      translateZ(42px)
      scale(1.10);

    box-shadow:
      0 0 20px
      rgba(141,232,255,.16);
  }
}


@keyframes thinkingPulse{

  50%{
    transform:
      translateZ(65px)
      scale(.90);

    opacity:.65;
  }
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(
  max-height:520px
){

  .core-stage{
    height:250px;
  }

  .core{
    width:190px;
    height:190px;
  }

  .waveform-line{
    height:100px;
  }
}

</style>

</head>


<body>


<!-- LOGIN -->

<div
  class="auth-gate"
  id="authGate"
>

  <form
    class="auth-card"
    id="loginForm"
  >

    <div class="auth-core"></div>

    <div class="auth-title">
      J.A.R.V.I.S.
    </div>

    <div class="auth-subtitle">
      AUTHORISED ACCESS ONLY
    </div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="username"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button
      id="loginButton"
      type="submit"
    >
      AUTHENTICATE
    </button>

    <div
      class="auth-error"
      id="authError"
    ></div>

  </form>

</div>



<!-- MAIN -->

<div
  class="panel standby"
  id="panel"
>

  <div
    class="scene-glow"
    id="sceneGlow"
  ></div>

  <div
    class="depth-shadow"
  ></div>


  <div class="top">

    <div>
      J.A.R.V.I.S.
    </div>

    <div class="online">

      <span class="dot"></span>

      <span id="linkState">
        ONLINE
      </span>

      <button
        class="logout"
        id="logoutButton"
      >
        LOG OUT
      </button>

    </div>

  </div>


  <div class="centre">


    <div class="core-stage">


      <canvas
        class="waveform-line"

/* =========================================================
   MAIN WAVEFORM
========================================================= */

function drawWaveform(
  data,
  level
){

  const canvas =
    el(
      "waveformLine"
    );


  const ctx =
    canvas
      .getContext(
        "2d"
      );


  const w =
    canvas.width;


  const h =
    canvas.height;


  const mid =
    h / 2;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  if(
    voicePhase !==
    "speaking"
  ){
    return;
  }


  const left =
    w *
    .08;


  const right =
    w *
    .92;


  const usable =
    right -
    left;


  const amp =
    18 +
    level *
    90;


  /*
    background zero line
  */

  ctx.beginPath();


  ctx.moveTo(
    left,
    mid
  );


  ctx.lineTo(
    right,
    mid
  );


  ctx.strokeStyle =
    "rgba(141,232,255,.055)";


  ctx.lineWidth =
    2;


  ctx.stroke();



  /*
    soft outer waveform
  */

  ctx.beginPath();


  for(
    let i = 0;
    i < data.length;
    i++
  ){

    const x =
      left +
      (
        i /
        (
          data.length -
          1
        )
      ) *
      usable;


    const n =
      (
        data[i] -
        128
      ) /
      128;


    const centreDistance =
      Math.abs(
        (
          x -
          w / 2
        ) /
        (
          usable / 2
        )
      );


    const envelope =
      .35 +
      (
        1 -
        centreDistance
      ) *
      .65;


    const y =
      mid +
      n *
      amp *
      envelope;


    if(
      i === 0
    ){

      ctx.moveTo(
        x,
        y
      );

    } else {

      ctx.lineTo(
        x,
        y
      );
    }
  }


  ctx.strokeStyle =
    `rgba(
      141,
      232,
      255,
      ${
        .24 +
        level *
        .26
      }
    )`;


  ctx.lineWidth =
    7;


  ctx.shadowColor =
    "rgba(141,232,255,.30)";


  ctx.shadowBlur =
    26;


  ctx.stroke();



  /*
    sharp waveform
  */

  ctx.beginPath();


  for(
    let i = 0;
    i < data.length;
    i++
  ){

    const x =
      left +
      (
        i /
        (
          data.length -
          1
        )
      ) *
      usable;


    const n =
      (
        data[i] -
        128
      ) /
      128;


    const centreDistance =
      Math.abs(
        (
          x -
          w / 2
        ) /
        (
          usable / 2
        )
      );


    const envelope =
      .35 +
      (
        1 -
        centreDistance
      ) *
      .65;


    const y =
      mid +
      n *
      amp *
      envelope;


    if(
      i === 0
    ){

      ctx.moveTo(
        x,
        y
      );

    } else {

      ctx.lineTo(
        x,
        y
      );
    }
  }


  ctx.strokeStyle =
    `rgba(
      170,
      241,
      255,
      ${
        .63 +
        level *
        .30
      }
    )`;


  ctx.lineWidth =
    2.4;


  ctx.shadowColor =
    "rgba(141,232,255,.75)";


  ctx.shadowBlur =
    13;


  ctx.stroke();


  ctx.shadowBlur =
    0;
}



/* =========================================================
   AUDIO LOOP
========================================================= */

function animateAudio(){

  if(
    !remoteAnalyser ||
    !audioTimeData
  ){
    return;
  }


  remoteAnalyser
    .getByteTimeDomainData(
      audioTimeData
    );


  let sum =
    0;


  for(
    let i = 0;
    i < audioTimeData.length;
    i++
  ){

    const n =
      (
        audioTimeData[i] -
        128
      ) /
      128;


    sum +=
      n *
      n;
  }


  const rms =
    Math.sqrt(
      sum /
      audioTimeData.length
    );


  let level =
    (
      rms -
      .004
    ) *
    14;


  level =
    Math.max(
      0,
      Math.min(
        1,
        level
      )
    );


  smoothLevel =
    smoothLevel *
      .68
    +
    level *
      .32;


  const v =
    smoothLevel;


  /*
    very subtle ring response
  */

  animateWave(
    "wave1",
    1 +
      v *
      .12,
    .04 +
      v *
      .10
  );


  animateWave(
    "wave2",
    1 +
      v *
      .18,
    .02 +
      v *
      .07
  );


  el(
    "coreDot"
  )
  .style.transform =
    `
      translateZ(65px)
      scale(${
        1 +
        v *
        .10
      })
    `;


  el(
    "coreHalo"
  )
  .style.transform =
    `
      translateZ(42px)
      scale(${
        1 +
        v *
        .10
      })
    `;


  /*
    tiny 3D movement
  */

  if(
    voicePhase ===
    "speaking"
  ){

    el(
      "core"
    )
    .style.transform =
      `
        rotateX(${
          3 +
          v *
          2
        }deg)
        rotateY(${
          -4 -
          v *
          2
        }deg)
        translateY(${
          -v *
          2
        }px)
        scale(${
          1.015 +
          v *
          .01
        })
      `;
  }


  drawWaveform(
    audioTimeData,
    v
  );


  animationFrame =
    requestAnimationFrame(
      animateAudio
    );
}

/* =========================================================
   REALTIME EVENTS
========================================================= */

function handleRealtimeEvent(
  event
){

  const type =
    event?.type ||
    "";


  if(
    type ===
    "input_audio_buffer.speech_started"
  ){

    setVoicePhase(
      "listening"
    );


    return;
  }


  if(
    type ===
    "input_audio_buffer.speech_stopped"
  ){

    setVoicePhase(
      "analysing"
    );


    return;
  }


  if(
    type ===
    "response.created"
  ){

    setVoicePhase(
      "analysing"
    );


    return;
  }


  /*
    IMPORTANT:
    speaking remains active whenever
    OpenAI sends output audio.
  */

  if(
    type ===
    "response.output_audio.delta"
    ||
    (
      type.includes(
        "output_audio"
      )
      &&
      type.includes(
        "delta"
      )
    )
  ){

    setVoicePhase(
      "speaking"
    );


    return;
  }


  if(
    type ===
    "response.done"
    ||
    type ===
    "response.completed"
  ){

    setVoicePhase(
      "listening"
    );


    return;
  }


  if(
    type ===
    "error"
  ){

    console.error(
      event
    );


    el(
      "status"
    )
    .textContent =
      "VOICE LINK ERROR";


    el(
      "message"
    )
    .textContent =
      event?.error?.message
      ||
      "Realtime channel reported an error.";
  }
}



/* =========================================================
   START VOICE
========================================================= */

async function startVoice(){

  if(
    peerConnection
  ){
    return;
  }


  const button =
    el(
      "voiceButton"
    );


  button.disabled =
    true;


  button.textContent =
    "CONNECTING...";


  setVoicePhase(
    "connecting"
  );


  try{


    const {
      data:tokenData,
      error:tokenError
    } =
      await supabase
        .functions
        .invoke(
          "jarvis-realtime",
          {
            body:{}
          }
        );


    if(
      tokenError
    ){

      throw tokenError;
    }


    const key =
      tokenData?.value;


    if(
      !key
    ){

      throw new Error(
        "No ephemeral realtime key returned."
      );
    }



    const pc =
      new RTCPeerConnection();


    peerConnection =
      pc;



    /*
      speaker
    */

    const audio =
      document.createElement(
        "audio"
      );


    audio.autoplay =
      true;


    audio.playsInline =
      true;


    audio.style.display =
      "none";


    document.body
      .appendChild(
        audio
      );


    remoteAudio =
      audio;


    pc.ontrack =
      event => {

        const stream =
          event.streams[0];


        audio.srcObject =
          stream;


        setupAudioVisuals(
          stream
        );


        audio.play()
          .catch(
            error =>
              console.warn(
                error
              )
          );
      };



    /*
      microphone
    */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }
        });


    localStream =
      stream;


    pc.addTrack(
      stream
        .getAudioTracks()[0],
      stream
    );



    /*
      realtime event channel
    */

    const dc =
      pc.createDataChannel(
        "oai-events"
      );


    dataChannel =
      dc;


    dc.addEventListener(
      "open",
      () => {

        button.disabled =
          false;


        button.textContent =
          "DISCONNECT VOICE";


        button
          .classList
          .add(
            "active"
          );


        setVoicePhase(
          "listening"
        );
      }
    );


    dc.addEventListener(
      "message",
      event => {

        try{

          handleRealtimeEvent(
            JSON.parse(
              event.data
            )
          );

        } catch(error){

          console.warn(
            error
          );
        }
      }
    );



    const offer =
      await pc
        .createOffer();


    await pc
      .setLocalDescription(
        offer
      );



    const response =
      await fetch(
        "https://api.openai.com/v1/realtime/calls",
        {

          method:
            "POST",

          body:
            offer.sdp,

          headers:{

            "Authorization":
              `Bearer ${key}`,

            "Content-Type":
              "application/sdp"

          }

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        await response
          .text()
      );
    }



    await pc
      .setRemoteDescription({

        type:
          "answer",

        sdp:
          await response
            .text()

      });


  } catch(error){

    console.error(
      error
    );


    stopVoice(
      false
    );


    el(
      "status"
    )
    .textContent =
      "VOICE LINK FAILED";


    el(
      "message"
    )
    .textContent =
      error?.message
      ||
      "Realtime connection failed.";


    button.disabled =
      false;


    button.textContent =
      "RETRY VOICE";
  }
}



/* =========================================================
   STOP
========================================================= */

function stopVoice(
  updateUi = true
){

  const pc =
    peerConnection;


  const dc =
    dataChannel;


  peerConnection =
    null;


  dataChannel =
    null;


  resetAudioVisuals();


  if(
    localStream
  ){

    for(
      const track
      of localStream
        .getTracks()
    ){

      track.stop();
    }


    localStream =
      null;
  }


  if(
    remoteAudio
  ){

    try{

      remoteAudio.pause();


      remoteAudio
        .remove();

    } catch{}


    remoteAudio =
      null;
  }


  try{
    dc?.close();
  }catch{}


  try{
    pc?.close();
  }catch{}


  voicePhase =
    "disconnected";


  const button =
    el(
      "voiceButton"
    );


  button.disabled =
    false;


  button.textContent =
    "ACTIVATE VOICE";


  button
    .classList
    .remove(
      "active"
    );


  setVisualState(
    "standby"
  );


  if(
    updateUi
  ){

    restoreBaseStatus();
  }
}

        "email"
      )
      .value
      .trim();


    const password =
      el(
        "password"
      )
      .value;


    const button =
      el(
        "loginButton"
      );


    button.disabled =
      true;


    button.textContent =
      "AUTHENTICATING...";


    const {
      error
    } =
      await supabase
        .auth
        .signInWithPassword({
          email,
          password
        });


    button.disabled =
      false;


    button.textContent =
      "AUTHENTICATE";


    if(
      error
    ){

      el(
        "authError"
      )
      .textContent =
        "ACCESS DENIED";


      return;
    }


    el(
      "password"
    )
    .value =
      "";


    showDashboard();
  }
);



el(
  "logoutButton"
)
.addEventListener(
  "click",
  async () => {

    stopVoice(
      false
    );


    await supabase
      .auth
      .signOut({
        scope:
          "local"
      });


    showLogin();
  }
);



/* =========================================================
   SESSION
========================================================= */

const {
  data:{
    session
  }
} =
  await supabase
    .auth
    .getSession();


if(
  session
){

  showDashboard();

} else {

  showLogin();
}



supabase
  .auth
  .onAuthStateChange(
    (
      event,
      session
    ) => {

      if(
        event ===
        "SIGNED_OUT"
      ){

        showLogin();
      }


      if(
        event ===
        "SIGNED_IN"
        &&
        session
      ){

        showDashboard();
      }
    }
  );

</script>

</body>
</html>
