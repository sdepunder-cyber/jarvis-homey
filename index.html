<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
  :root{--bg:#071018;--text:#eaf8ff;--muted:#7f9aa8;--glow:#8de8ff}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text);overflow:hidden}
  body{display:flex;align-items:stretch;justify-content:stretch;padding:0}
  .panel{width:100%;height:100%;position:relative;overflow:hidden;background:
    radial-gradient(circle at 50% 45%, rgba(65,182,222,.10), transparent 35%),
    linear-gradient(180deg, rgba(8,18,28,1), rgba(3,9,14,1));
    box-shadow:inset 0 0 40px rgba(95,210,255,.04)}
  .top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px 4px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
  .online{display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow)}
  .centre{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center}
  .core{position:relative;width:122px;height:122px;margin:auto;display:flex;align-items:center;justify-content:center}
  .ring,.ring2,.ring3{position:absolute;border-radius:50%;border:1px solid rgba(141,232,255,.4)}
  .ring{inset:0;animation:spin 12s linear infinite}
  .ring:before,.ring:after{content:"";position:absolute;background:var(--glow);box-shadow:0 0 9px var(--glow);border-radius:50%}
  .ring:before{width:5px;height:5px;left:9px;top:25px} .ring:after{width:4px;height:4px;right:13px;bottom:22px}
  .ring2{inset:14px;border-style:dashed;opacity:.55;animation:spinReverse 18s linear infinite}
  .ring3{inset:31px;border-width:2px;opacity:.65;animation:pulse 2.8s ease-in-out infinite}
  .core-dot{width:24px;height:24px;border-radius:50%;border:1px solid rgba(141,232,255,.9);
    box-shadow:0 0 20px rgba(141,232,255,.55), inset 0 0 12px rgba(141,232,255,.25)}
  h1{font-size:15px;letter-spacing:.32em;margin:10px 0 7px;padding-left:.32em;font-weight:600}
  .status{font-size:11px;letter-spacing:.2em;color:var(--glow);min-height:16px}
  .message{margin-top:8px;font-size:11px;color:var(--muted);min-height:16px}
  .bottom{position:absolute;left:14px;right:14px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .metric{border-top:1px solid rgba(141,232,255,.15);padding-top:7px;text-align:center}
  .metric b{display:block;font-size:12px;font-weight:500}
  .metric span{font-size:8px;letter-spacing:.13em;color:var(--muted)}
  .stale{opacity:.55}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinReverse{to{transform:rotate(-360deg)}}
  @keyframes pulse{50%{transform:scale(1.08);opacity:1}}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="top">
    <div>J.A.R.V.I.S.</div>
    <div class="online"><span class="dot" id="dot"></span><span id="linkState">ONLINE</span></div>
  </div>
  <div class="centre">
    <div class="core">
      <div class="ring"></div><div class="ring2"></div><div class="ring3"></div><div class="core-dot"></div>
    </div>
    <h1>JARVIS</h1>
    <div class="status" id="status">SYSTEM INTEGRITY 100%</div>
    <div class="message" id="message">Standing by, sir.</div>
  </div>
  <div class="bottom">
    <div class="metric"><b id="temp">--.-°C</b><span>HOME</span></div>
    <div class="metric"><b id="solar">-- kW</b><span>SOLAR</span></div>
    <div class="metric"><b id="bmw">--%</b><span>BMW</span></div>
    <div class="metric"><b id="grid">-- kW</b><span>GRID</span></div>
  </div>
</div>
<script>
const SUPABASE_URL = "https://hibrzsnwkbngaaujdvxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_yJBOE5AnX7-N8EkV98LNnA_LJ0KEz-P";
const endpoint = `${SUPABASE_URL}/rest/v1/jarvis_status?id=eq.1&select=id,temperature,solar,bmw,grid,updated_at`;

const el = id => document.getElementById(id);

function fmtKw(value){
  if(value === null || value === undefined || Number.isNaN(Number(value))) return "-- kW";
  return `${(Number(value)/1000).toFixed(2)} kW`;
}

async function loadData(){
  try {
    const r = await fetch(endpoint, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      },
      cache: "no-store"
    });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const rows = await r.json();
    if(!rows.length) throw new Error("No data");
    const d = rows[0];

    el("temp").textContent = d.temperature == null ? "--.-°C" : `${Number(d.temperature).toFixed(1)}°C`;
    el("solar").textContent = fmtKw(d.solar);
    el("bmw").textContent = d.bmw == null ? "--%" : `${Math.round(Number(d.bmw))}%`;
    el("grid").textContent = fmtKw(d.grid);

    const updated = d.updated_at ? new Date(d.updated_at) : null;
    const ageSec = updated ? (Date.now() - updated.getTime()) / 1000 : 999999;
    if(ageSec > 180){
      el("status").textContent = "DATA LINK STALE";
      el("message").textContent = "Home data has not been updated recently, sir.";
      document.querySelector(".bottom").classList.add("stale");
    } else {
      el("status").textContent = "SYSTEM INTEGRITY 100%";
      el("message").textContent = "Standing by, sir.";
      document.querySelector(".bottom").classList.remove("stale");
    }
    el("linkState").textContent = "ONLINE";
  } catch(e) {
    el("linkState").textContent = "LINK DEGRADED";
    el("status").textContent = "DATA LINK DEGRADED";
    el("message").textContent = "I appear to have misplaced Homey, sir.";
  }
}

loadData();
setInterval(loadData, 5000);
</script>
</body>
</html>
